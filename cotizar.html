<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Pedido de precios</title>
<link rel="icon" href="icono.png">
<style>
  @font-face { font-family:"Manrope"; font-weight:400; font-display:swap; src:url(fonts/manrope-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:600; font-display:swap; src:url(fonts/manrope-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:700; font-display:swap; src:url(fonts/manrope-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:800; font-display:swap; src:url(fonts/manrope-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:400; font-display:swap; src:url(fonts/kalam-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:700; font-display:swap; src:url(fonts/kalam-latin-700-normal.woff2) format("woff2"); }
  :root {
    --paper:#EEF2EC; --slip:#FFFDF5; --rule:#CFE0EA; --margin:#E9A9A0; --ink:#18291F; --ink-2:#3A4B41; --muted:#5E6E64;
    --line:#DAE2D7; --leaf:#1F4D35; --leaf-2:#2C6847; --lime:#B9DC5A; --lime-soft:#EAF5CC; --red:#B23A2A; --amber:#8A5A08;
    --hand:"Kalam","Segoe Print","Comic Sans MS",cursive; --font:"Manrope","Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:var(--font); color:var(--ink); background:var(--paper); line-height:1.5; font-variant-numeric:tabular-nums;
    padding:0 16px calc(96px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; }
  [hidden] { display:none !important; }
  .wrap { max-width:560px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:8px; padding:14px 0 10px; font-size:13px; color:var(--muted); }
  .lang { margin-left:auto; display:flex; gap:3px; }
  .lang button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 8px; font:700 12px var(--font); color:var(--muted); cursor:pointer; }
  .lang button.on { background:var(--leaf); border-color:var(--leaf); color:#fff; }

  /* la nota de pedido: como la que el bodeguero escribe a mano */
  .slip { background:var(--slip); border-radius:14px; box-shadow:0 1px 2px rgba(24,41,31,.06),0 8px 24px rgba(24,41,31,.08); position:relative; overflow:hidden; }
  .rows { background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); border-top:1.5px solid var(--rule); }
  .slip::before { content:""; position:absolute; top:0; bottom:0; left:46px; width:1.5px; background:var(--margin); opacity:.75; }
  #done .slip::before, #gone .slip::before, #loading.slip::before, #gone.slip::before, #done.slip::before { display:none; }
  .slip-head { padding:18px 18px 10px 60px; position:relative; }
  .store { font-family:var(--hand); font-weight:700; font-size:34px; line-height:1.05; color:var(--leaf); margin:0; letter-spacing:-.01em; word-break:break-word; }
  .ask { margin:6px 0 0; font-size:15px; color:var(--ink-2); }
  .meta { margin:6px 0 0; font-size:13px; color:var(--muted); }
  .note { margin:10px 0 0; font-family:var(--hand); font-size:18px; color:var(--ink-2); }

  .rows { list-style:none; margin:0; padding:4px 0 8px; position:relative; }
  .row { display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:12px 16px 12px 60px; border-top:1px dashed #E3E8DE; }
  .row:first-child { border-top:0; }
  .row { background:var(--slip); }
  .qty { position:absolute; left:6px; width:36px; text-align:right; font-family:var(--hand); font-weight:700; font-size:19px; color:var(--leaf-2); }
  .row { position:relative; }
  .name { font-weight:700; font-size:15.5px; line-height:1.3; }
  .unit { display:block; font-size:12.5px; color:var(--muted); font-weight:600; }
  .price { display:flex; align-items:center; border:1.5px solid var(--line); border-radius:10px; background:#fff; padding:0 10px; height:46px; width:148px; }
  .price:focus-within { border-color:var(--leaf-2); box-shadow:0 0 0 3px var(--lime-soft); }
  .price span { color:var(--muted); font-weight:700; font-size:14px; margin-right:6px; }
  .price input { border:0; outline:0; width:100%; font:700 18px var(--font); color:var(--ink); background:transparent; text-align:right; font-variant-numeric:tabular-nums; }
  .opts { grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tog { border:1px solid var(--line); background:#fff; color:var(--ink-2); border-radius:999px; padding:5px 11px; font:600 13px var(--font); cursor:pointer; }
  .tog[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .avail { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .avail input { width:74px; height:32px; border:1.5px solid var(--line); border-radius:8px; padding:0 8px; font:700 15px var(--font); text-align:right; }
  .row.none .name { text-decoration:line-through; color:var(--muted); }
  .row.none .price { opacity:.35; pointer-events:none; }

  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; display:grid; gap:12px; }
  .card h2 { margin:0; font-size:16px; }
  label.f { display:grid; gap:5px; font-size:13.5px; font-weight:700; color:var(--ink-2); }
  label.f input, label.f textarea { border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font:500 16px var(--font); color:var(--ink); background:#fff; width:100%; }
  label.f input:focus, label.f textarea:focus { outline:0; border-color:var(--leaf-2); box-shadow:0 0 0 3px var(--lime-soft); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  .sum { font-size:13px; color:var(--muted); line-height:1.3; } .sum b { display:block; color:var(--ink); font-size:17px; }
  .btn { margin-left:auto; border:0; border-radius:12px; background:var(--leaf); color:#fff; font:800 16px var(--font); padding:14px 20px; cursor:pointer; min-width:150px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn:focus-visible, .tog:focus-visible, .lang button:focus-visible { outline:2px solid var(--leaf-2); outline-offset:2px; }

  .state { text-align:center; padding:28px 18px; }
  .state h1 { font-family:var(--hand); font-size:32px; color:var(--leaf); margin:0 0 6px; line-height:1.1; }
  .state p { margin:0 auto; max-width:40ch; color:var(--ink-2); }
  .done-mark { width:64px; height:64px; border-radius:50%; background:var(--lime-soft); color:var(--leaf); display:grid; place-items:center; margin:0 auto 10px; }
  .msg { border-radius:10px; padding:10px 12px; font-weight:600; font-size:14px; } .msg.bad { background:#F8E2DD; color:var(--red); }
  .foot { text-align:center; font-size:12px; color:var(--muted); margin:18px 0 0; }
  .foot a { color:var(--muted); }
  @media (max-width:400px) { .price { width:126px; } .store { font-size:29px; } .slip::before { left:40px; } .row, .slip-head { padding-left:52px; } .qty { width:30px; } }
  @media (prefers-reduced-motion: no-preference) { .done-mark { animation:pop .35s ease-out; } @keyframes pop { from { transform:scale(.6); opacity:0; } } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span data-t="by"></span>
    <div class="lang"><button data-l="es">ES</button><button data-l="pt">PT</button><button data-l="en">EN</button></div></div>

  <div id="loading" class="slip"><div class="state"><p data-t="loading"></p></div></div>
  <div id="gone" class="slip" hidden><div class="state"><h1 data-t="gone_t"></h1><p data-t="gone"></p></div></div>

  <form id="form" hidden autocomplete="off">
    <section class="slip" aria-labelledby="store">
      <div class="slip-head">
        <h1 class="store" id="store"></h1>
        <p class="ask" id="ask"></p>
        <p class="meta" id="meta"></p>
        <p class="note" id="note" hidden></p>
      </div>
      <ul class="rows" id="rows"></ul>
    </section>

    <section class="card">
      <h2 data-t="cond"></h2>
      <label class="f"><span data-t="days"></span><input id="days" maxlength="40"></label>
      <div class="chips" id="dchips"></div>
      <label class="f"><span data-t="terms"></span><input id="terms" maxlength="80"></label>
      <div class="chips" id="tchips"></div>
      <label class="f"><span data-t="note2"></span><textarea id="note2" rows="2" maxlength="400"></textarea></label>
      <label class="f"><span data-t="who"></span><input id="who" maxlength="60" autocomplete="name"></label>
      <div class="msg bad" id="err" hidden></div>
    </section>
    <p class="foot"><span data-t="foot"></span> <a href="https://limasoftwares.com" target="_blank" rel="noopener">limasoftwares.com</a> · <a href="https://limasoftwares.com/privacidad.html" target="_blank" rel="noopener" data-t="priv"></a></p>
  </form>

  <div id="done" class="slip" hidden><div class="state">
    <div class="done-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></div>
    <h1 data-t="done_t"></h1><p id="donep"></p>
    <p style="margin-top:14px"><button type="button" class="tog" id="edit" data-t="edit"></button></p>
  </div></div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <div class="sum"><span id="cnt"></span><b id="tot"></b></div>
  <button class="btn" id="send" form="form" type="submit" data-t="send"></button>
</div></div>

<script>
const API = "https://lima-api.shamer-licond.workers.dev";
const T = {
  by: ["Pedido de precios · Lima Gestor", "Pedido de cotação · Lima Gestor", "Price request · Lima Gestor"],
  loading: ["Cargando el pedido…", "Carregando o pedido…", "Loading the request…"],
  gone_t: ["Este enlace no está activo", "Este link não está ativo", "This link isn't active"],
  gone: ["Puede que ya haya vencido o que la tienda lo haya cerrado. Si quieres, responde con tus precios por WhatsApp.", "Pode ter vencido ou a loja pode ter fechado. Se quiser, responda com seus preços pelo WhatsApp.", "It may have expired or the store closed it. If you like, reply with your prices on WhatsApp."],
  ask: ["{s}, ¿a cuánto nos dejas estos productos?", "{s}, por quanto você nos vende estes produtos?", "{s}, what's your price for these products?"],
  meta: ["Escribe el precio por unidad. Respuestas hasta el {d}.", "Escreva o preço por unidade. Respostas até {d}.", "Write the price per unit. Answers until {d}."],
  closed: ["La tienda ya cerró esta cotización. Gracias.", "A loja já fechou esta cotação. Obrigado.", "The store already closed this request. Thanks."],
  none: ["No tengo", "Não tenho", "Don't have"],
  less: ["Tengo menos", "Tenho menos", "Have fewer"],
  have: ["Tengo", "Tenho", "I have"],
  cond: ["Entrega y pago", "Entrega e pagamento", "Delivery and payment"],
  days: ["¿Cuándo puedes entregar?", "Quando você pode entregar?", "When can you deliver?"],
  terms: ["Forma de pago", "Forma de pagamento", "Payment terms"],
  note2: ["Algo más (opcional)", "Algo mais (opcional)", "Anything else (optional)"],
  who: ["Tu nombre (opcional)", "Seu nome (opcional)", "Your name (optional)"],
  dch: [["Hoy", "Mañana", "En 2 días", "Esta semana"], ["Hoje", "Amanhã", "Em 2 dias", "Esta semana"], ["Today", "Tomorrow", "In 2 days", "This week"]],
  tch: [["Contado", "Yape / Plin", "Crédito 7 días", "Crédito 15 días"], ["À vista", "PIX", "Boleto 7 dias", "Boleto 15 dias"], ["Cash", "Transfer", "7-day credit", "15-day credit"]],
  send: ["Enviar precios", "Enviar preços", "Send prices"],
  update: ["Actualizar precios", "Atualizar preços", "Update prices"],
  cnt: ["{n} de {k} con precio", "{n} de {k} com preço", "{n} of {k} priced"],
  tot: ["Total aprox. {v}", "Total aprox. {v}", "Approx. total {v}"],
  need: ["Pon al menos un precio o marca «No tengo».", "Coloque pelo menos um preço ou marque «Não tenho».", "Add at least one price or mark «Don't have»."],
  fail: ["No se pudo enviar. Revisa tu internet e inténtalo de nuevo.", "Não foi possível enviar. Verifique a internet e tente de novo.", "Couldn't send. Check your internet and try again."],
  done_t: ["¡Gracias!", "Obrigado!", "Thank you!"],
  donep: ["{s} ya puede ver tus precios. Si cambia algo, puedes corregirlos hasta el {d}.", "{s} já pode ver seus preços. Se algo mudar, pode corrigir até {d}.", "{s} can already see your prices. If anything changes, you can edit them until {d}."],
  edit: ["Corregir mis precios", "Corrigir meus preços", "Edit my prices"],
  foot: ["Este pedido lo envía la tienda con Lima Gestor. Tus precios solo los ve esa tienda.", "Este pedido é enviado pela loja com o Lima Gestor. Seus preços só essa loja vê.", "The store sends this request with Lima Gestor. Only that store sees your prices."],
  un: ["und.", "un.", "pcs"],
  priv: ["Privacidad", "Privacidade", "Privacy"],
};
const I = { es: 0, pt: 1, en: 2 };
const SYM = { PEN: "S/", BRL: "R$" };
const tok = ((location.hash || "").slice(1) || new URLSearchParams(location.search).get("q") || "").trim();
const m = tok.match(/^([a-f0-9]{16})\.([a-f0-9]{8})$/);
let L = "es", D = null, sent = false;
const tx = (k, v = {}) => { let s = T[k][I[L]]; for (const [a, b] of Object.entries(v)) s = s.replaceAll(`{${a}}`, b); return s; };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const first = (n) => String(n || "").trim().split(/\s+/)[0] || "";
const dfmt = (iso) => { const [y, mo, d] = String(iso || "").split("-"); return L === "en" ? `${mo}/${d}` : `${d}/${mo}`; };
// el dinero según el país de la tienda: S/ 1,234.50 (Perú) · R$ 1.234,50 (Brasil)
const cents = (v) => { let s = String(v ?? "").trim().replace(/[^\d.,]/g, ""); if (!s) return null;
  const c = s.lastIndexOf(","), p = s.lastIndexOf("."); s = c > p ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  const n = parseFloat(s); return isNaN(n) ? null : Math.round(n * 100); };
const money = (c) => { const v = (c || 0) / 100; return `${SYM[D.cur] || ""} ${D.cur === "BRL" ? v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; };
const qfmt = (q) => (Number.isInteger(q) ? String(q) : String(+q.toFixed(2)).replace(".", L === "en" ? "." : ","));

function paintStatic() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = tx(e.dataset.t); });
  document.querySelectorAll("[data-l]").forEach((b) => b.classList.toggle("on", b.dataset.l === L));
}
function paint() {
  paintStatic();
  if (!D) return;
  document.title = `${D.store} · ${tx("by").split(" · ")[0]}`;
  $("#store").textContent = D.store;
  $("#ask").textContent = tx("ask", { s: D.who || D.sup });
  $("#meta").textContent = D.open ? tx("meta", { d: dfmt(D.exp) }) : tx("closed");
  $("#note").hidden = !D.note; $("#note").textContent = D.note || "";
  $("#dchips").innerHTML = T.dch[I[L]].map((c) => `<button type="button" class="tog" data-fill="days">${esc(c)}</button>`).join("");
  $("#tchips").innerHTML = T.tch[I[L]].map((c) => `<button type="button" class="tog" data-fill="terms">${esc(c)}</button>`).join("");
  document.querySelectorAll("[data-none]").forEach((b) => (b.textContent = tx("none")));
  document.querySelectorAll("[data-less]").forEach((b) => (b.textContent = tx("less")));
  document.querySelectorAll("[data-havel]").forEach((b) => (b.textContent = tx("have")));
  document.querySelectorAll(".unit").forEach((u) => (u.textContent = u.dataset.u === "un" ? tx("un") : u.dataset.u));
  $("#send").textContent = tx(sent ? "update" : "send");
  if ($("#donep")) $("#donep").textContent = tx("donep", { s: D.store, d: dfmt(D.exp) });
  sum();
}
function rows() {
  const prev = {}; (D.ans?.offers || []).forEach((o) => (prev[o.i] = o));
  $("#rows").innerHTML = D.items.map((it) => {
    const o = prev[it.i] || {};
    return `<li class="row ${o.x ? "none" : ""}" data-i="${it.i}">
      <span class="qty">${qfmt(it.q)}</span>
      <div><div class="name">${esc(it.n)}</div><span class="unit" data-u="${esc(it.u)}"></span></div>
      <label class="price"><span>${SYM[D.cur] || ""}</span><input inputmode="decimal" aria-label="${esc(it.n)}" value="${o.p != null ? (o.p / 100).toFixed(2).replace(".", D.cur === "BRL" ? "," : ".") : ""}" ${D.open ? "" : "disabled"}></label>
      <div class="opts">
        <button type="button" class="tog" data-none aria-pressed="${!!o.x}" ${D.open ? "" : "disabled"}></button>
        <button type="button" class="tog" data-less aria-pressed="${o.a != null}" ${D.open ? "" : "disabled"}></button>
        <span class="avail" ${o.a != null ? "" : "hidden"}><span data-havel></span><input inputmode="decimal" value="${o.a != null ? qfmt(o.a) : ""}"></span>
      </div></li>`;
  }).join("");
}
function collect() {
  return [...document.querySelectorAll(".row")].map((r) => {
    const none = r.querySelector("[data-none]").getAttribute("aria-pressed") === "true";
    const less = r.querySelector("[data-less]").getAttribute("aria-pressed") === "true";
    const a = less ? parseFloat((r.querySelector(".avail input").value || "").replace(",", ".")) : null;
    return { i: +r.dataset.i, p: none ? null : cents(r.querySelector(".price input").value), a: less && !isNaN(a) ? a : null, x: none };
  });
}
function sum() {
  if (!D) return;
  const offs = collect(), byI = Object.fromEntries(D.items.map((it) => [it.i, it]));
  const priced = offs.filter((o) => o.p), total = priced.reduce((a, o) => a + o.p * Math.min(byI[o.i].q, o.a ?? byI[o.i].q), 0);
  $("#cnt").textContent = tx("cnt", { n: priced.length, k: D.items.length });
  $("#tot").textContent = tx("tot", { v: money(Math.round(total)) });
  $("#send").disabled = !D.open || !offs.some((o) => o.p || o.x);
}

document.addEventListener("click", (e) => {
  const l = e.target.closest("[data-l]"); if (l) { L = l.dataset.l; paint(); return; }
  const nb = e.target.closest("[data-none],[data-less]");
  if (nb) {
    const on = nb.getAttribute("aria-pressed") !== "true"; nb.setAttribute("aria-pressed", on);
    const r = nb.closest(".row");
    if (nb.hasAttribute("data-none")) { r.classList.toggle("none", on); if (on) { r.querySelector("[data-less]").setAttribute("aria-pressed", "false"); r.querySelector(".avail").hidden = true; } }
    else { r.querySelector(".avail").hidden = !on; if (on) r.querySelector(".avail input").focus(); }
    sum(); return;
  }
  const f = e.target.closest("[data-fill]"); if (f) { $("#" + f.dataset.fill).value = f.textContent; return; }
  if (e.target.closest("#edit")) { $("#done").hidden = true; $("#form").hidden = false; $("#bar").hidden = false; window.scrollTo(0, 0); }
});
document.addEventListener("input", (e) => { if (e.target.closest(".row")) sum(); });
$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const offers = collect().filter((o) => o.p || o.x);
  const err = $("#err");
  if (!offers.length) { err.hidden = false; err.textContent = tx("need"); return; }
  err.hidden = true;
  const b = $("#send"); b.disabled = true;
  try {
    const r = await fetch(`${API}/v1/rfq/q/${m[1]}.${m[2]}`, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ offers, days: $("#days").value, terms: $("#terms").value, note: $("#note2").value, who: $("#who").value }) });
    if (r.status === 409) { D.open = false; paint(); rows(); throw new Error("closed"); }
    if (!r.ok) throw new Error("http");
    sent = true;
    try { localStorage.setItem("lg_rfq_who", $("#who").value); } catch { /* sin almacenamiento */ }
    $("#form").hidden = true; $("#bar").hidden = true; $("#done").hidden = false; paint(); window.scrollTo(0, 0);
  } catch (ex) { if (ex.message !== "closed") { err.hidden = false; err.textContent = tx("fail"); } }
  b.disabled = false; sum();
});

(async () => {
  L = (navigator.language || "es").startsWith("pt") ? "pt" : (navigator.language || "").startsWith("en") ? "en" : "es";
  paintStatic();
  if (!m) { $("#loading").hidden = true; $("#gone").hidden = false; return; }
  try {
    const r = await fetch(`${API}/v1/rfq/q/${m[1]}.${m[2]}`);
    if (!r.ok) throw new Error("gone");
    D = await r.json();
  } catch { $("#loading").hidden = true; $("#gone").hidden = false; return; }
  L = D.lang || L;
  sent = !!D.ans;
  rows();
  if (D.ans) { $("#days").value = D.ans.days || ""; $("#terms").value = D.ans.terms || ""; $("#note2").value = D.ans.note || ""; $("#who").value = D.ans.who || ""; }
  else { try { $("#who").value = localStorage.getItem("lg_rfq_who") || ""; } catch { /* */ } }
