<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lima Gestor · Sistema de ventas para tiendas · Lima Softwares</title>
<meta name="description" content="Lima Gestor: ventas, stock, fiados, caja y bot de WhatsApp para bodegas, minimarkets y tiendas de Perú y Brasil. Funciona sin internet. Prueba 15 días gratis.">
<meta name="theme-color" content="#1F4D35">
<link rel="icon" href="icono.png">
<style>
  @font-face { font-family:"Bricolage Grotesque"; font-weight:600; font-display:swap; src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:700; font-display:swap; src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:800; font-display:swap; src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:400; font-display:swap; src:url(fonts/manrope-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:500; font-display:swap; src:url(fonts/manrope-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:600; font-display:swap; src:url(fonts/manrope-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:700; font-display:swap; src:url(fonts/manrope-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:800; font-display:swap; src:url(fonts/manrope-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:400; font-display:swap; src:url(fonts/kalam-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:700; font-display:swap; src:url(fonts/kalam-latin-700-normal.woff2) format("woff2"); }
  :root {
    --forest:#1F4D35; --night:#143524; --leaf:#2E6B4A; --lime:#B9DC5A; --lime2:#A6CC45; --limesoft:#EAF5CC;
    --paper:#F3F6F1; --ink:#18291F; --muted:#5E6E64; --line:#DAE2D7; --white:#fff; --wa:#25D366;
    --rule:#C7D8E6; --margin:#E2A196; --pencil:#2B3A6B;
    --display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } * { transition:none !important; animation:none !important; } }
  body { margin:0; font:400 17px/1.6 "Manrope", system-ui, sans-serif; color:var(--ink); background:var(--white); -webkit-font-smoothing:antialiased; }
  a { color:var(--leaf); }
  img { max-width:100%; display:block; }
  :focus-visible { outline:3px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .wrap { max-width:1160px; margin:0 auto; padding:0 20px; }
  h1, h2, h3 { font-family:var(--display); color:var(--ink); margin:0; font-weight:800; letter-spacing:-.02em; }
  h2 { font-size:clamp(28px,3.4vw,42px); line-height:1.08; }
  h3 { font-size:clamp(23px,2.3vw,29px); line-height:1.15; font-weight:700; }
  p { margin:0; }
  .muted { color:var(--muted); }

  /* ---------- cabecera */
  header { position:sticky; top:0; z-index:30; background:rgba(31,77,53,.97); backdrop-filter:blur(8px); }
  header .wrap { display:flex; align-items:center; gap:22px; height:64px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font:800 19px/1 var(--display); letter-spacing:-.01em; }
  .brand img { width:34px; height:34px; border-radius:9px; background:#fff; padding:3px; }
  nav.links { display:flex; gap:22px; }
  nav.links a { color:#DCE9D9; text-decoration:none; font-weight:600; font-size:15px; }
  nav.links a:hover { color:#fff; }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .lang { display:flex; border:1px solid rgba(255,255,255,.25); border-radius:9px; overflow:hidden; }
  .lang button { border:0; background:none; padding:5px 9px; font:700 12.5px "Manrope", system-ui, sans-serif; color:#CFE0CB; cursor:pointer; }
  .lang button.on { background:var(--lime); color:var(--night); }
  .burger { display:none; background:none; border:0; color:#fff; font-size:24px; cursor:pointer; }

  /* ---------- botones */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px; border-radius:12px; text-decoration:none; border:2px solid transparent; font:700 16px "Manrope", system-ui, sans-serif; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s; }
  .btn.p { background:var(--lime); color:var(--night); } .btn.p:hover { background:var(--lime2); }
  .btn.ghost { color:#fff; border-color:rgba(255,255,255,.35); } .btn.ghost:hover { border-color:#fff; }
  .btn.s { background:#fff; color:var(--forest); border-color:var(--line); } .btn.s:hover { border-color:var(--forest); }
  .btn.dark { background:var(--forest); color:#fff; } .btn.dark:hover { background:var(--night); }
  .btn.wa { background:var(--wa); color:#0B3D20; }
  .btn.sm { padding:9px 15px; font-size:14.5px; border-radius:10px; }
  .btn.off { background:#C9D4C8; color:#fff; cursor:not-allowed; }

  /* ---------- portada: del cuaderno al sistema */
  .hero { background:var(--forest); color:#fff; padding:64px 0 88px; overflow:hidden; }
  .hero .wrap { display:grid; grid-template-columns:1fr 1.12fr; gap:56px; align-items:center; }
  .hero h1 { color:#fff; font-size:clamp(44px,6.4vw,82px); line-height:.96; letter-spacing:-.035em; margin-bottom:22px; }
  .hero .lead { font-size:19px; color:#DCE9D9; max-width:31em; margin-bottom:28px; }
  .btns { display:flex; gap:12px; flex-wrap:wrap; }
  .fine { font-size:14.5px; color:#B9CDB6; margin-top:16px; }
  .fine b { color:#fff; }
  #refbox { background:var(--lime); color:var(--night); border-radius:10px; padding:10px 14px; margin-top:16px; font-size:14.5px; }
  .stage { position:relative; min-height:470px; }
  .notebook { position:absolute; left:0; top:-10px; width:66%; aspect-ratio:3/4; transform:rotate(-5deg);
    background:#FCFCF8 repeating-linear-gradient(180deg, transparent 0 33px, var(--rule) 33px 34px); background-position:0 52px;
    border-radius:4px 10px 10px 4px; box-shadow:0 22px 50px rgba(0,0,0,.35); padding:22px 20px 0 58px; color:var(--pencil); font-family:"Kalam", cursive; }
  .notebook::before { content:""; position:absolute; left:44px; top:0; bottom:0; width:2px; background:var(--margin); }
  .notebook .nb-h { font-weight:700; font-size:22px; line-height:34px; height:52px; }
  .notebook .nb { font-size:18px; line-height:34px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  .notebook .nb s { text-decoration-thickness:2px; text-decoration-color:#B4473A; }
  .notebook .nb.q { color:#B4473A; transform:rotate(-2deg); transform-origin:left; }
  .screen-shot { position:relative; margin-left:30%; margin-top:236px; border-radius:12px; overflow:hidden; background:#fff;
    box-shadow:0 30px 70px rgba(5,25,14,.55), 0 0 0 1px rgba(255,255,255,.08); transform:rotate(1.5deg); }

  /* ---------- secciones */
  section { padding:88px 0; }
  .center { text-align:center; }
  .sub { color:var(--muted); font-size:18px; max-width:40em; margin:14px auto 0; }
  .head { margin-bottom:46px; }
  .feat { display:grid; grid-template-columns:.9fr 1.25fr; gap:60px; align-items:center; padding:44px 0; border-top:1px solid var(--line); }
  .feat:first-of-type { border-top:0; }
  .feat.rev { grid-template-columns:1.25fr .9fr; } .feat.rev .txt { order:2; }
  .feat .txt p { color:var(--muted); margin:12px 0 18px; }
  .frame { border-radius:12px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:0 18px 40px rgba(31,77,53,.12); }
  ul.ticks { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  ul.ticks li { padding-left:28px; position:relative; }
  ul.ticks li::before { content:""; position:absolute; left:2px; top:.5em; width:14px; height:8px; border-left:3px solid var(--leaf); border-bottom:3px solid var(--leaf); transform:rotate(-45deg); }

  /* ---------- bot */
  .botsec { background:var(--night); color:#fff; }
  .botsec h2 { color:#fff; }
  .botsec p { color:#C3D5C0; }
  .botsec ul.ticks li::before { border-color:var(--lime); }
  .botgrid { display:grid; grid-template-columns:1fr 360px; gap:64px; align-items:center; }
  .tag { display:inline-block; font:800 13px "Manrope", system-ui, sans-serif; border-radius:999px; padding:4px 11px; background:var(--lime); color:var(--night); vertical-align:middle; letter-spacing:0; margin-left:6px; }
  .phone { width:340px; margin:0 auto; background:#0b141a; border-radius:38px; padding:12px; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .screen { background:#efeae2; border-radius:28px; overflow:hidden; }
  .wa-top { background:#075E54; color:#fff; padding:12px 14px; display:flex; gap:10px; align-items:center; font-weight:700; font-size:14px; }
  .wa-top .av { width:30px; height:30px; border-radius:50%; background:#fff; display:grid; place-items:center; }
  .wa-top small { display:block; font-weight:500; opacity:.8; font-size:11px; }
  .msgs { padding:12px 10px 16px; display:flex; flex-direction:column; gap:7px; min-height:420px; font-size:13px; color:#111; }
  .m { max-width:84%; padding:7px 10px; border-radius:10px; box-shadow:0 1px 1px rgba(0,0,0,.08); line-height:1.4; }
  .m.in { background:#fff; align-self:flex-start; border-top-left-radius:2px; }
  .m.out { background:#d9fdd3; align-self:flex-end; border-top-right-radius:2px; }
  .m .btnrow { margin-top:6px; border-top:1px solid #e9e9e9; padding-top:6px; color:#027eb5; text-align:center; font-weight:600; }

  /* ---------- además (lista, no tarjetas) */
  .also { display:grid; grid-template-columns:repeat(2,1fr); column-gap:64px; }
  .also div { padding:22px 0; border-top:1px solid var(--line); }
  .also h4 { margin:0 0 6px; font:700 18px/1.3 var(--display); color:var(--forest); }
  .also p { color:var(--muted); font-size:16px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px 10px; justify-content:center; margin-top:28px; }
  .seg span { border:1px solid var(--line); border-radius:999px; padding:7px 15px; font-weight:600; font-size:15px; color:var(--forest); background:#fff; }

  /* ---------- planes */
  .plans-bg { background:var(--paper); }
  .ctry { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; margin:26px 0 30px; }
  .ctry button { border:0; background:none; font:700 15px "Manrope", system-ui, sans-serif; padding:9px 18px; border-radius:9px; cursor:pointer; color:var(--muted); }
  .ctry button.on { background:var(--forest); color:#fff; }
  .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; text-align:left; align-items:stretch; }
  .plan { background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px; position:relative; display:flex; flex-direction:column; }
  .plan.best { border:2px solid var(--forest); }
  .plan .badge { position:absolute; top:-13px; left:24px; background:var(--lime); color:var(--night); font-size:13px; font-weight:800; border-radius:999px; padding:4px 11px; }
  .plan h4 { margin:0 0 8px; font:700 18px var(--display); color:var(--forest); }
  .price { font:800 42px/1 var(--display); color:var(--ink); letter-spacing:-.03em; }
  .per { color:var(--muted); font-size:15px; margin-top:6px; }
  .save { color:var(--leaf); font-weight:700; font-size:14.5px; min-height:24px; margin-top:2px; }
  .plan .note { flex:1; }
  .addon { margin-top:18px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 22px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; text-align:left; }
  .addon b { color:var(--forest); }
  .note { font-size:14.5px; color:var(--muted); margin-top:16px; }

  /* ---------- descarga */
  .dl { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:center; background:var(--forest); color:#fff; border-radius:24px; padding:44px; }
  .dl h2 { color:#fff; }
  .dl .sub { color:#C3D5C0; margin:14px 0 0; }
  .dl ol { margin:18px 0 0; padding-left:20px; color:#DCE9D9; font-size:15.5px; display:grid; gap:4px; }
  .dl .btn.p { font-size:18px; padding:17px 28px; }
  .ver { font-size:14.5px; color:#C3D5C0; margin-top:10px; }

  /* ---------- preguntas */
  .faq { max-width:820px; margin:36px auto 0; border-top:1px solid var(--line); }
  details { border-bottom:1px solid var(--line); padding:18px 4px; }
  summary { cursor:pointer; font-weight:700; font-size:17.5px; color:var(--ink); list-style:none; display:flex; justify-content:space-between; gap:16px; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"+"; color:var(--leaf); font:700 24px/1 "Manrope", system-ui, sans-serif; }
  details[open] summary::after { content:"−"; }
  details p { color:var(--muted); margin:10px 0 0; max-width:44em; }

  .contact { background:var(--limesoft); border-radius:24px; padding:38px 42px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; }
  .contact p { color:var(--forest); margin-top:8px; }
  footer { background:var(--night); color:#B9CDB6; padding:44px 0 28px; font-size:14.5px; margin-top:88px; }
  footer .wrap { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:28px; }
  footer b { color:#fff; display:block; margin-bottom:8px; }
  footer a { color:#B9CDB6; text-decoration:none; display:block; margin:5px 0; } footer a:hover { color:#fff; }
  .copy { text-align:center; color:#8FA88C; font-size:13px; margin-top:30px; }

  @media (max-width:920px) {
    nav.links { display:none; position:absolute; top:64px; left:0; right:0; background:var(--forest); flex-direction:column; padding:16px 20px; gap:14px; border-top:1px solid rgba(255,255,255,.12); }
    nav.links.open { display:flex; } .burger { display:block; }
    .right .btn { display:none; }
    .hero { padding:44px 0 64px; }
    .hero .wrap, .feat, .feat.rev, .botgrid, .dl, .contact { grid-template-columns:1fr; }
    .feat { gap:28px; } .feat.rev .txt { order:0; }
    .stage { min-height:0; margin-top:10px; }
    .notebook { width:76%; left:0; top:-8px; padding-left:46px; }
    .notebook::before { left:34px; }
    .notebook .nb { font-size:15px; } .notebook .nb-h { font-size:18px; }
    .screen-shot { margin-left:18%; margin-top:200px; }
    .also { grid-template-columns:1fr; }
    .plans { grid-template-columns:1fr; }
    .dl { padding:30px 24px; } .contact { padding:28px 24px; }
    footer .wrap { grid-template-columns:1fr 1fr; }
    .phone { width:100%; max-width:340px; }
    section { padding:64px 0; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#"><img src="icono.png" alt="">Lima Gestor</a>
  <nav class="links" id="nav">
    <a href="#funciones" data-t="nav_feat"></a>
    <a href="#bot" data-t="nav_bot"></a>
    <a href="#planes" data-t="nav_plans"></a>
    <a href="#preguntas" data-t="nav_faq"></a>
    <a href="#descargar" data-t="nav_dl"></a>
  </nav>
  <div class="right">
    <div class="lang"><button data-set="es">ES</button><button data-set="pt">PT</button><button data-set="en">EN</button></div>
    <a class="btn p sm" href="#descargar" data-t="cta_try"></a>
    <button class="burger" id="burger" aria-label="menu">☰</button>
  </div>
</div></header>

<div class="hero"><div class="wrap">
  <div>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="btns">
      <a class="btn p" href="#descargar" data-t="cta_try"></a>
      <a class="btn ghost" data-wa data-t="cta_wa"></a>
    </div>
    <p class="fine" data-t="fine" data-html></p>
    <p id="refbox" hidden></p>
  </div>
  <div class="stage" aria-hidden="true">
    <div class="notebook">
      <div class="nb-h" data-t="nb_h"></div>
      <div class="nb"><s data-t="nb_1"></s></div>
      <div class="nb"><s data-t="nb_2"></s></div>
      <div class="nb"><s data-t="nb_3"></s></div>
      <div class="nb q" data-t="nb_4"></div>
    </div>
    <div class="screen-shot"><img data-img="venta" alt="Lima Gestor"></div>
  </div>
</div></div>

<section id="funciones"><div class="wrap">
  <div class="center head"><h2 data-t="f_title"></h2><p class="sub" data-t="f_sub"></p></div>
  <div class="feat" id="f-venta">
    <div class="txt"><h3 data-t="v_t"></h3><p data-t="v_p"></p>
      <ul class="ticks"><li data-t="v_1"></li><li data-t="v_2"></li><li data-t="v_3"></li><li data-t="v_4"></li></ul></div>
    <div class="frame"><img data-img="venta" alt="" loading="lazy"></div>
  </div>
  <div class="feat rev" id="f-stock">
    <div class="txt"><h3 data-t="s_t"></h3><p data-t="s_p"></p>
      <ul class="ticks"><li data-t="s_1"></li><li data-t="s_2"></li><li data-t="s_3"></li><li data-t="s_4"></li></ul></div>
    <div class="frame"><img data-img="productos" alt="" loading="lazy"></div>
  </div>
  <div class="feat" id="f-fiado">
    <div class="txt"><h3 data-t="c_t"></h3><p data-t="c_p"></p>
      <ul class="ticks"><li data-t="c_1"></li><li data-t="c_2"></li><li data-t="c_3"></li></ul></div>
    <div class="frame"><img data-img="fiado" alt="" loading="lazy"></div>
  </div>
  <div class="feat rev" id="f-caja">
    <div class="txt"><h3 data-t="k_t"></h3><p data-t="k_p"></p>
      <ul class="ticks"><li data-t="k_1"></li><li data-t="k_2"></li><li data-t="k_3"></li></ul></div>
    <div class="frame"><img data-img="caja" alt="" loading="lazy"></div>
  </div>
</div></section>

<section class="botsec" id="bot"><div class="wrap botgrid">
  <div>
    <h2><span data-t="b_t"></span><span class="tag" data-t="b_tag"></span></h2>
    <p style="margin:16px 0 24px" data-t="b_p"></p>
    <ul class="ticks"><li data-t="b_1"></li><li data-t="b_2"></li><li data-t="b_3"></li><li data-t="b_4"></li><li data-t="b_5"></li><li data-t="b_6"></li></ul>
  </div>
  <div class="phone"><div class="screen">
    <div class="wa-top"><span class="av">🏪</span><span><span data-t="chat_store"></span><small data-t="chat_bus"></small></span></div>
    <div class="msgs">
      <div class="m out" data-t="chat_1"></div>
      <div class="m in" data-t="chat_2" data-html></div>
      <div class="m out" data-t="chat_3"></div>
      <div class="m in" data-t="chat_4" data-html></div>
      <div class="m out" data-t="chat_5"></div>
      <div class="m in" data-t="chat_6" data-html></div>
    </div>
  </div></div>
</div></section>

<section id="mas"><div class="wrap">
  <div class="center head"><h2 data-t="m_title"></h2><p class="sub" data-t="m_sub"></p></div>
  <div class="also">
    <div><h4 data-t="m1_t"></h4><p data-t="m1_p"></p></div>
    <div><h4 data-t="m2_t"></h4><p data-t="m2_p"></p></div>
    <div><h4 data-t="m3_t"></h4><p data-t="m3_p"></p></div>
    <div><h4 data-t="m4_t"></h4><p data-t="m4_p"></p></div>
    <div><h4 data-t="m5_t"></h4><p data-t="m5_p"></p></div>
    <div><h4 data-t="m6_t"></h4><p data-t="m6_p"></p></div>
    <div><h4 data-t="m7_t"></h4><p data-t="m7_p"></p></div>
    <div><h4 data-t="m8_t"></h4><p data-t="m8_p"></p></div>
  </div>
  <div class="center" style="margin-top:64px"><h3 data-t="seg_t"></h3><p class="sub" data-t="seg_sub"></p><div class="seg" id="seg"></div></div>
</div></section>

<section class="plans-bg" id="planes"><div class="wrap center">
  <h2 data-t="p_t"></h2><p class="sub" data-t="p_sub"></p>
  <div class="ctry"><button data-c="PE">🇵🇪 Perú</button><button data-c="BR">🇧🇷 Brasil</button></div>
  <div class="plans" id="plans"></div>
  <div class="addon"><div style="flex:1;min-width:240px"><b data-t="p_bot_t"></b><br><span id="botprice"></span></div>
    <a class="btn s sm" href="#bot" data-t="p_bot_more"></a></div>
  <p class="note" data-t="p_note"></p>
</div></section>

<section id="descargar"><div class="wrap">
  <div class="dl">
    <div>
      <h2 data-t="d_t"></h2>
      <p class="sub" data-t="d_p"></p>
      <ol><li data-t="d_1"></li><li data-t="d_2"></li><li data-t="d_3"></li></ol>
    </div>

    [["¿Funciona sin internet?", "Sí. Ventas, stock, fiados y caja funcionan sin conexión. Internet solo se usa para el bot de WhatsApp, para buscar el nombre de un producto por su código y para activar la licencia."],

    [["¿Gano algo si recomiendo Lima Gestor?", "Sí: 1 mes gratis por cada tienda nueva que pague su primera licencia con tu código. Tu código está en Configuración → Licencia → Recomienda y gana, con un botón para enviarlo por WhatsApp. El mes se suma solo a tu licencia."],

     ["Do I get anything for referring Lima Gestor?", "Yes: 1 free month for every new store that pays its first license with your code. Your code is in Settings → License → Refer and earn, with a button to send it on WhatsApp. The month is added to your license automatically."]],
    [["¿Cómo funciona la prueba gratis?", "Instalas y usas todas las funciones por 15 días, sin tarjeta. Si te sirve, eliges un plan y pagas por Yape/Plin o PIX; la licencia se activa sola. Si no, no pagas nada."],
     ["Como funciona o teste grátis?", "Você instala e usa todas as funções por 15 dias, sem cartão. Se servir, escolhe um plano e paga por PIX; a licença ativa sozinha. Se não, não paga nada."],
     ["How does the free trial work?", "Install and use every feature for 15 days, no card needed. If it works for you, pick a plan and pay by Yape/Plin or PIX; the license activates by itself. If not, you pay nothing."]],
    [["¿Mis datos están seguros?", "Tu información se guarda solo en tu computadora, con copia de seguridad automática cada día. Lima Softwares no tiene acceso a tus ventas ni a tus clientes."],
     ["Meus dados estão seguros?", "Suas informações ficam só no seu computador, com cópia de segurança automática todos os dias. A Lima Softwares não tem acesso às suas vendas nem aos seus clientes."],
     ["Is my data safe?", "Your information is stored only on your computer, with an automatic daily backup. Lima Softwares has no access to your sales or customers."]],
    [["¿Emite boleta o factura electrónica?", "En Brasil sí: emite la NFC-e de cada venta a través de Focus NFe (la tienda contrata Focus NFe aparte, desde R$ 62,90/mes, y registra ahí su certificado digital). En Perú todavía no: Lima Gestor entrega comprobantes internos en PDF (con IGV desglosado); la boleta o factura electrónica la emites por tu cuenta con SUNAT."],
     ["Emite NFC-e ou nota fiscal?", "Sim, a NFC-e: em cada venda o Lima Gestor emite a nota pela Focus NFe (a loja contrata a Focus NFe à parte, a partir de R$ 62,90/mês, e cadastra lá o certificado digital). Sem internet, a nota fica na fila e é enviada sozinha depois. MEI não é obrigado a emitir NFC-e."],
     ["Does it issue electronic invoices?", "In Brazil, yes: it issues each sale's NFC-e through Focus NFe (the store hires Focus NFe separately). In Peru not yet: Lima Gestor issues internal PDF receipts; you issue the electronic invoice yourself with SUNAT."]],
    [["¿Y si no tengo lector de códigos?", "Puedes leer los códigos con la cámara de la computadora o del celular que usas como caja. Ojo: cámaras básicas, sin enfoque automático o con poca luz muchas veces no leen códigos pequeños; para vender rápido, un lector USB o Bluetooth (desde S/ 40) es mucho mejor. Lima Gestor necesita una computadora con Windows como principal: un celular solo no puede ser la principal."],
     ["E se eu não tiver leitor de código?", "Dá para ler os códigos com a câmera do computador ou do celular que você usa como caixa. Atenção: câmeras simples, sem foco automático ou com pouca luz muitas vezes não leem códigos pequenos; para vender rápido, um leitor USB ou Bluetooth (a partir de R$ 60) é muito melhor. O Lima Gestor precisa de um computador com Windows como principal: um celular sozinho não pode ser o principal."],
     ["What if I don't have a barcode scanner?", "You can scan barcodes with the camera of the computer or the phone you use as a register. Note: basic cameras, without autofocus or in low light often can't read small barcodes; a USB or Bluetooth scanner is much faster. Lima Gestor needs a Windows computer as the main one: a phone alone can't be the main computer."]],
    [["¿Necesito una computadora potente?", "No. Funciona en cualquier PC con Windows 10 u 11 y 4 GB de RAM. Puedes usar un lector de códigos USB y una impresora de tickets o normal."],
     ["Preciso de um computador potente?", "Não. Funciona em qualquer PC com Windows 10 ou 11 e 4 GB de RAM. Você pode usar um leitor USB e uma impressora térmica ou comum."],
     ["Do I need a powerful computer?", "No. It runs on any PC with Windows 10 or 11 and 4 GB RAM. You can use a USB barcode scanner and a receipt or regular printer."]],
    [["¿Puedo pasar mis productos de otro sistema o de Excel?", "Sí. Descargas la plantilla de Excel, pegas tus productos y los importas de una vez. También te ayudamos por WhatsApp."],
     ["Posso trazer meus produtos de outro sistema ou do Excel?", "Sim. Baixe o modelo de Excel, cole seus produtos e importe de uma vez. Também ajudamos pelo WhatsApp."],
     ["Can I bring my products from another system or Excel?", "Yes. Download the Excel template, paste your products and import them at once. We also help on WhatsApp."]],
    [["¿Qué pasa si vence mi licencia?", "El programa queda en solo lectura: puedes ver y exportar todo, pero no registrar ventas nuevas. Tus datos no se borran. Al renovar, sigue igual."],
     ["O que acontece se a licença vencer?", "O programa fica só para consulta: você pode ver e exportar tudo, mas não registrar vendas novas. Seus dados não são apagados. Ao renovar, segue igual."],
     ["What happens if my license expires?", "The program goes read-only: you can view and export everything but not record new sales. Your data isn't deleted. Renew and it carries on."]],
    [["¿Puedo usarlo en varias computadoras?", "Sí. Una computadora es la principal y guarda los datos; las demás de la tienda se conectan a ella por el mismo WiFi o, si están en otra red, con el código de la tienda. Tú apruebas cada una y todas ven el mismo stock, ventas y caja al momento. Cada computadora extra se paga aparte y se compra desde el programa. Para otra tienda, escríbenos."],
     ["Posso usar em vários computadores?", "Sim. Um computador é o principal e guarda os dados; os outros da loja se conectam a ele pelo mesmo Wi-Fi ou, se estiverem em outra rede, com o código da loja. Você aprova cada um e todos veem o mesmo estoque, vendas e caixa na hora. Cada computador extra é pago à parte e comprado pelo programa. Para outra loja, fale conosco."],
     ["Can I use it on several computers?", "Yes. One computer is the main one and keeps the data; the store's other computers connect to it over the same Wi-Fi or, from another network, with the store code. You approve each one and they all see the same stock, sales and register in real time. Each extra computer is paid separately and bought from the program. For another store, message us."]],
    [["¿Qué necesito para el bot de WhatsApp?", "Un número de WhatsApp Business de tu tienda y el adicional del bot en tu licencia. Meta da 1.000 conversaciones gratis al mes y Lima Gestor se detiene antes del límite para que no pagues nada a Meta. Te ayudamos a conectarlo."],
     ["O que preciso para o robô de WhatsApp?", "Um número de WhatsApp Business da sua loja e o adicional do robô na sua licença. A Meta dá 1.000 conversas grátis por mês e o Lima Gestor para antes do limite para você não pagar nada à Meta. Ajudamos a conectar."],
     ["What do I need for the WhatsApp bot?", "A WhatsApp Business number for your store and the bot add-on on your license. Meta gives 1,000 free conversations a month and Lima Gestor stops before the limit so you pay Meta nothing. We help you connect it."]],
  ],
  ct_t: ["¿Tienes dudas? Conversemos", "Tem dúvidas? Vamos conversar", "Questions? Let's talk"],
  ct_p: ["Te ayudamos a instalarlo, cargar tus productos y conectar tu WhatsApp. Atención de lunes a sábado.", "Ajudamos a instalar, cadastrar seus produtos e conectar seu WhatsApp. Atendimento de segunda a sábado.", "We help you install it, load your products and connect your WhatsApp. Monday to Saturday."],
  foot_tag: ["Desarrollo de software · Asistencia técnica personalizada", "Desenvolvimento de software · Suporte técnico personalizado", "Software development · Personal tech support"],
  foot_prod: ["Producto", "Produto", "Product"], foot_help: ["Ayuda", "Ajuda", "Help"], foot_terms: ["Términos y condiciones", "Termos e condições", "Terms and conditions"], foot_priv: ["Política de privacidad", "Política de privacidade", "Privacy policy"], foot_del: ["Eliminar mis datos", "Apagar meus dados", "Delete my data"],
  wa_msg: ["Hola, quiero información de Lima Gestor", "Olá, quero informações do Lima Gestor", "Hi, I'd like info about Lima Gestor"],
};
const PRICES = {  // igual que en Lima Gestor (licencia.py)
  PE: { cur: "S/ ", m: 119, s: 619, a: 1079, bot: [99, 529, 929] },
  BR: { cur: "R$ ", m: 179, s: 899, a: 1579, bot: [149, 779, 1349] },
};
// Programa de referidos: el enlace que comparte una tienda trae ?ref=ABC-DEF
const REF = (new URLSearchParams(location.search).get("ref") || "").toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 6);
T.ref_box = ["🎁 Te recomendó una tienda que ya usa Lima Gestor. Cuando pagues tu licencia, escribe su código <b>{c}</b> en «Código de quien te recomendó».", "🎁 Uma loja que já usa o Lima Gestor te indicou. Quando pagar a licença, coloque o código <b>{c}</b> em «Código de quem indicou».", "🎁 A store that already uses Lima Gestor referred you. When you pay for your license, enter code <b>{c}</b> under «Referral code»."];
const LI = { es: 0, pt: 1, en: 2 };
let L = "es", C = "PE", VER = null, userC = false;
const tx = (k) => (T[k] || [k, k, k])[LI[L]];
const fmt = (v) => {
  const loc = C === "BR" ? "pt-BR" : "es-PE";
  return PRICES[C].cur + v.toLocaleString(loc, { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
};
function render() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-set]").forEach((b) => b.classList.toggle("on", b.dataset.set === L));
  document.querySelectorAll("[data-t]").forEach((el) => { const v = tx(el.dataset.t); if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v; });
  const rb = document.getElementById("refbox");
  if (rb && REF.length === 6) { rb.hidden = false; rb.innerHTML = tx("ref_box").replace("{c}", REF.slice(0, 3) + "-" + REF.slice(3)); }
  document.querySelectorAll("[data-img]").forEach((im) => { im.src = `img/${L}_${im.dataset.img}.jpg`; });
  document.querySelectorAll("[data-wa]").forEach((a) => { a.href = `https://wa.me/${WA}?text=${encodeURIComponent(tx("wa_msg"))}`; a.target = "_blank"; a.rel = "noopener"; });
  document.getElementById("seg").innerHTML = T.segs[LI[L]].map((s) => `<span>${s}</span>`).join("");
  document.getElementById("faq").innerHTML = T.faq.map((q) => { const [a, b] = q[LI[L]]; return `<details><summary>${a}</summary><p>${b}</p></details>`; }).join("");
  document.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", b.dataset.c === C));
  const P = PRICES[C];
  const plan = (k, months, price, best) => {
    const save = P.m * months - price;
    return `<div class="plan ${best ? "best" : ""}">${best ? `<span class="badge">${tx("p_best")}</span>` : ""}
      <h4>${tx(k)}</h4><div class="price">${fmt(price)}</div>
      <div class="per">${months === 1 ? tx("p_per_m") : tx("p_eq").replace("{v}", fmt(Math.round(price / months * 100) / 100))}</div>
      <div class="save">${save > 0 ? tx("p_save").replace("{v}", fmt(save)) : ""}</div>
      <p class="note" style="margin-top:10px">${tx("p_inc")}</p>
      <a class="btn ${best ? "p" : "s"}" style="width:100%;margin-top:6px" href="#descargar">${tx("cta_try")}</a></div>`;
  };
  document.getElementById("plans").innerHTML = plan("p_m", 1, P.m) + plan("p_s", 6, P.s) + plan("p_a", 12, P.a, true);
  document.getElementById("botprice").textContent = tx("p_bot_price").replace("{m}", fmt(P.bot[0])).replace("{s}", fmt(P.bot[1])).replace("{a}", fmt(P.bot[2]));
  const btn = document.getElementById("dlbtn"), ver = document.getElementById("ver");
  if (VER && VER.parts && VER.parts.length) {
    btn.href = "#descargar"; btn.classList.remove("off"); btn.removeAttribute("aria-disabled");
    ver.textContent = tx("d_ver").replace("{v}", VER.version).replace("{s}", VER.size_mb || "≈30");
  } else {
    btn.removeAttribute("href"); btn.classList.add("off"); btn.setAttribute("aria-disabled", "true");
    ver.textContent = tx("d_soon");
  }
  try { localStorage.setItem("lang", L); if (userC) localStorage.setItem("ctry", C); } catch (e) {}
}
document.querySelectorAll("[data-set]").forEach((b) => b.onclick = () => { L = b.dataset.set; if (!userC) C = L === "pt" ? "BR" : "PE"; render(); });
document.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { C = b.dataset.c; userC = true; render(); });
document.getElementById("burger").onclick = () => document.getElementById("nav").classList.toggle("open");
document.querySelectorAll("#nav a").forEach((a) => a.onclick = () => document.getElementById("nav").classList.remove("open"));
try {
  const s = localStorage.getItem("lang"); const n = (navigator.language || "es").slice(0, 2);
  L = s in LI ? s : (n in LI ? n : "es");
  const c = localStorage.getItem("ctry"); if (c in PRICES) { C = c; userC = true; } else C = L === "pt" ? "BR" : "PE";
} catch (e) {}
document.getElementById("y").textContent = new Date().getFullYear();
render();
// Descarga: el instalador está en pedazos de 20 MB (límite de Cloudflare Pages); aquí se juntan en un solo .exe
let busy = false;
document.getElementById("dlbtn").addEventListener("click", async (e) => {
  e.preventDefault();
  if (busy || !VER || !VER.parts || !VER.parts.length) return;
  busy = true;
  const ver = document.getElementById("ver"), total = VER.bytes || 1, chunks = [];
  let got = 0;
  try {
    for (const p of VER.parts) {
      const r = await fetch(p + "?v=" + VER.version);
      if (!r.ok) throw new Error(r.status);
      const rd = r.body.getReader();
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        chunks.push(value); got += value.length;
        ver.textContent = tx("d_prog").replace("{p}", Math.min(100, Math.round(got * 100 / total)));
      }
    }
    const blob = new Blob(chunks, { type: "application/octet-stream" });
    if (VER.sha256 && crypto.subtle) {  // comprueba que el archivo llegó completo y sin cambios
      const h = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
      if (h !== VER.sha256) throw new Error("hash");
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = VER.file || "LimaGestor_Instalador.exe";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    ver.textContent = tx("d_ok");
  } catch (err) {
    ver.textContent = tx("d_err");
  }
  busy = false;
});
// versión publicada: la escribe construir_instalador.bat en version.json
fetch("version.json?" + Date.now()).then((r) => (r.ok ? r.json() : null)).then((v) => { if (v) { VER = v; render(); } }).catch(() => {});
</script>
