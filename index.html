<!doctype html>
<html lang="es">
<head>
<meta name="facebook-domain-verification" content="bn8o1gogevpnf7shtfjws6deiew6n7" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lima Gestor · Sistema de ventas para tiendas · Lima Softwares</title>
<meta name="description" content="Lima Gestor: ventas, stock, fiados, caja y bot de WhatsApp para bodegas, minimarkets y tiendas de Perú y Brasil. Funciona sin internet. Prueba 15 días gratis.">
<meta name="theme-color" content="#1F4D35">
<link rel="icon" href="icono.png">
<style>
  [hidden] { display:none !important; }
  #direct { margin-top:14px; }
  #direct a { color:#fff; text-decoration:underline; text-underline-offset:3px; }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:600; font-display:swap; src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:700; font-display:swap; src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:800; font-display:swap; src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:400; font-display:swap; src:url(fonts/manrope-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:500; font-display:swap; src:url(fonts/manrope-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:600; font-display:swap; src:url(fonts/manrope-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:700; font-display:swap; src:url(fonts/manrope-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Manrope"; font-weight:800; font-display:swap; src:url(fonts/manrope-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:400; font-display:swap; src:url(fonts/kalam-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Kalam"; font-weight:700; font-display:swap; src:url(fonts/kalam-latin-700-normal.woff2) format("woff2"); }
  :root {
    --forest:#1F4D35; --night:#143524; --leaf:#2E6B4A; --lime:#B9DC5A; --lime2:#A6CC45; --limesoft:#EAF5CC;
    --paper:#F3F6F1; --ink:#18291F; --muted:#5E6E64; --line:#DAE2D7; --white:#fff; --wa:#25D366;
    --rule:#C7D8E6; --margin:#E2A196; --pencil:#2B3A6B;
    --display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } * { transition:none !important; animation:none !important; } }
  body { margin:0; font:400 17px/1.6 "Manrope", system-ui, sans-serif; color:var(--ink); background:var(--white); -webkit-font-smoothing:antialiased; }
  a { color:var(--leaf); }
  img { max-width:100%; display:block; }
  :focus-visible { outline:3px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .wrap { max-width:1160px; margin:0 auto; padding:0 20px; }
  h1, h2, h3 { font-family:var(--display); color:var(--ink); margin:0; font-weight:800; letter-spacing:-.02em; }
  h2 { font-size:clamp(28px,3.4vw,42px); line-height:1.08; }
  h3 { font-size:clamp(23px,2.3vw,29px); line-height:1.15; font-weight:700; }
  p { margin:0; }
  .muted { color:var(--muted); }

  /* ---------- cabecera */
  header { position:sticky; top:0; z-index:30; background:rgba(31,77,53,.97); backdrop-filter:blur(8px); }
  header .wrap { display:flex; align-items:center; gap:22px; height:64px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font:800 19px/1 var(--display); letter-spacing:-.01em; }
  .brand img { width:34px; height:34px; border-radius:9px; background:#fff; padding:3px; }
  nav.links { display:flex; gap:22px; }
  nav.links a { color:#DCE9D9; text-decoration:none; font-weight:600; font-size:15px; }
  nav.links a:hover { color:#fff; }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .lang { display:flex; border:1px solid rgba(255,255,255,.25); border-radius:9px; overflow:hidden; }
  .lang button { border:0; background:none; padding:5px 9px; font:700 12.5px "Manrope", system-ui, sans-serif; color:#CFE0CB; cursor:pointer; }
  .lang button.on { background:var(--lime); color:var(--night); }
  .burger { display:none; background:none; border:0; color:#fff; font-size:24px; cursor:pointer; }

  /* ---------- botones */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px; border-radius:12px; text-decoration:none; border:2px solid transparent; font:700 16px "Manrope", system-ui, sans-serif; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s; }
  .btn.p { background:var(--lime); color:var(--night); } .btn.p:hover { background:var(--lime2); }
  .btn.ghost { color:#fff; border-color:rgba(255,255,255,.35); } .btn.ghost:hover { border-color:#fff; }
  .btn.s { background:#fff; color:var(--forest); border-color:var(--line); } .btn.s:hover { border-color:var(--forest); }
  .btn.dark { background:var(--forest); color:#fff; } .btn.dark:hover { background:var(--night); }
  .btn.wa { background:var(--wa); color:#0B3D20; }
  .btn.sm { padding:9px 15px; font-size:14.5px; border-radius:10px; }
  .btn.off { background:#C9D4C8; color:#fff; cursor:not-allowed; }

  /* ---------- portada: del cuaderno al sistema */
  .hero { background:var(--forest); color:#fff; padding:64px 0 88px; overflow:hidden; }
  .hero .wrap { display:grid; grid-template-columns:1fr 1.12fr; gap:56px; align-items:center; }
  .hero h1 { color:#fff; font-size:clamp(44px,6.4vw,82px); line-height:.96; letter-spacing:-.035em; margin-bottom:22px; }
  .hero .lead { font-size:19px; color:#DCE9D9; max-width:31em; margin-bottom:28px; }
  .btns { display:flex; gap:12px; flex-wrap:wrap; }
  .fine { font-size:14.5px; color:#B9CDB6; margin-top:16px; }
  .fine b { color:#fff; }
  #refbox { background:var(--lime); color:var(--night); border-radius:10px; padding:10px 14px; margin-top:16px; font-size:14.5px; }
  .stage { position:relative; min-height:470px; }
  .notebook { position:absolute; left:0; top:-10px; width:66%; aspect-ratio:3/4; transform:rotate(-5deg);
    background:#FCFCF8 repeating-linear-gradient(180deg, transparent 0 33px, var(--rule) 33px 34px); background-position:0 52px;
    border-radius:4px 10px 10px 4px; box-shadow:0 22px 50px rgba(0,0,0,.35); padding:22px 20px 0 58px; color:var(--pencil); font-family:"Kalam", cursive; }
  .notebook::before { content:""; position:absolute; left:44px; top:0; bottom:0; width:2px; background:var(--margin); }
  .notebook .nb-h { font-weight:700; font-size:22px; line-height:34px; height:52px; }
  .notebook .nb { font-size:18px; line-height:34px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  .notebook .nb s { text-decoration-thickness:2px; text-decoration-color:#B4473A; }
  .notebook .nb.q { color:#B4473A; transform:rotate(-2deg); transform-origin:left; }
  .screen-shot { position:relative; margin-left:30%; margin-top:236px; border-radius:12px; overflow:hidden; background:#fff;
    box-shadow:0 30px 70px rgba(5,25,14,.55), 0 0 0 1px rgba(255,255,255,.08); transform:rotate(1.5deg); }

  /* ---------- secciones */
  section { padding:88px 0; }
  .center { text-align:center; }
  .sub { color:var(--muted); font-size:18px; max-width:40em; margin:14px auto 0; }
  .head { margin-bottom:46px; }
  .feat { display:grid; grid-template-columns:.9fr 1.25fr; gap:60px; align-items:center; padding:44px 0; border-top:1px solid var(--line); }
  .feat:first-of-type { border-top:0; }
  .feat.rev { grid-template-columns:1.25fr .9fr; } .feat.rev .txt { order:2; }
  .feat .txt p { color:var(--muted); margin:12px 0 18px; }
  .frame { border-radius:12px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:0 18px 40px rgba(31,77,53,.12); }
  ul.ticks { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  ul.ticks li { padding-left:28px; position:relative; }
  ul.ticks li::before { content:""; position:absolute; left:2px; top:.5em; width:14px; height:8px; border-left:3px solid var(--leaf); border-bottom:3px solid var(--leaf); transform:rotate(-45deg); }

  /* ---------- bot */
  .vids { display:grid; grid-template-columns:.8fr 1.3fr; gap:56px; align-items:center; }
  .vids .btns { margin-top:24px; }
  .player { position:relative; aspect-ratio:16/9; max-width:100%; border-radius:16px; overflow:hidden; background:var(--night); box-shadow:0 18px 40px rgba(31,77,53,.18); }
  .player img, .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; }
  .player button { position:absolute; inset:0; width:100%; border:0; background:transparent; cursor:pointer; padding:0; }
  .player .play { position:absolute; left:72%; top:52%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%; background:var(--lime); display:grid; place-items:center; box-shadow:0 10px 30px rgba(0,0,0,.35); transition:transform .15s; }
  .player button:hover .play, .player button:focus-visible .play { transform:scale(1.08); }
  .player .play svg { width:34px; height:34px; margin-left:5px; fill:var(--night); }
  .vids small { display:block; color:var(--muted, #5b6b60); font-size:14px; margin-top:12px; }
  @media (max-width:860px) { .vids { grid-template-columns:1fr; gap:28px; } }
  .botsec { background:var(--night); color:#fff; }
  .botsec h2 { color:#fff; }
  .botsec p { color:#C3D5C0; }
  .botsec ul.ticks li::before { border-color:var(--lime); }
  .botgrid { display:grid; grid-template-columns:1fr 360px; gap:64px; align-items:center; }
  .tag { display:inline-block; font:800 13px "Manrope", system-ui, sans-serif; border-radius:999px; padding:4px 11px; background:var(--lime); color:var(--night); vertical-align:middle; letter-spacing:0; margin-left:6px; }
  .phone { width:340px; margin:0 auto; background:#0b141a; border-radius:38px; padding:12px; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  .screen { background:#efeae2; border-radius:28px; overflow:hidden; }
  .wa-top { background:#075E54; color:#fff; padding:12px 14px; display:flex; gap:10px; align-items:center; font-weight:700; font-size:14px; }
  .wa-top .av { width:30px; height:30px; border-radius:50%; background:#fff; display:grid; place-items:center; }
  .wa-top small { display:block; font-weight:500; opacity:.8; font-size:11px; }
  .msgs { padding:12px 10px 16px; display:flex; flex-direction:column; gap:7px; min-height:420px; font-size:13px; color:#111; }
  .m { max-width:84%; padding:7px 10px; border-radius:10px; box-shadow:0 1px 1px rgba(0,0,0,.08); line-height:1.4; }
  .m.in { background:#fff; align-self:flex-start; border-top-left-radius:2px; }
  .m.out { background:#d9fdd3; align-self:flex-end; border-top-right-radius:2px; }
  .m .btnrow { margin-top:6px; border-top:1px solid #e9e9e9; padding-top:6px; color:#027eb5; text-align:center; font-weight:600; }

  /* ---------- además (lista, no tarjetas) */
  .also { display:grid; grid-template-columns:repeat(2,1fr); column-gap:64px; }
  .also div { padding:22px 0; border-top:1px solid var(--line); }
  .also h4 { margin:0 0 6px; font:700 18px/1.3 var(--display); color:var(--forest); }
  .also p { color:var(--muted); font-size:16px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px 10px; justify-content:center; margin-top:28px; }
  .seg span { border:1px solid var(--line); border-radius:999px; padding:7px 15px; font-weight:600; font-size:15px; color:var(--forest); background:#fff; }
  .rtabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:26px 0 18px; }
  .rtabs button { border:1px solid var(--line); background:#fff; color:var(--forest); border-radius:999px; padding:9px 16px; font:700 15px var(--display); cursor:pointer; }
  .rtabs button.on { background:var(--forest); color:#fff; border-color:var(--forest); }
  .rbody { background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px; text-align:left; max-width:900px; margin:0 auto; }
  .rbody .st { display:inline-block; border-radius:999px; padding:4px 12px; font-weight:800; font-size:13px; }
  .rbody .st.ok { background:var(--lime); color:var(--night); }
  .rbody .st.lim { background:#F8E8B8; color:#6A4B05; }
  .rbody .st.no { background:#E9ECEA; color:#4A5A50; }
  .rbody h4 { margin:18px 0 4px; color:var(--forest); font:700 16px var(--display); }
  .rbody ul { margin:6px 0 4px; padding-left:20px; line-height:1.65; }
  .rbody details { border-top:1px solid var(--line); padding:10px 0; }
  .rbody summary { cursor:pointer; font-weight:700; }
  .rbody details p { margin:8px 0 0; color:var(--muted); }
  .rbody .btn { margin-top:16px; }

  /* ---------- planes */
  .plans-bg { background:var(--paper); }
  .ctry { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; margin:26px 0 30px; }
  .ctry button { border:0; background:none; font:700 15px "Manrope", system-ui, sans-serif; padding:9px 18px; border-radius:9px; cursor:pointer; color:var(--muted); }
  .ctry button.on { background:var(--forest); color:#fff; }
  .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; text-align:left; align-items:stretch; }
  .plan { background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px; position:relative; display:flex; flex-direction:column; }
  .plan.best { border:2px solid var(--forest); }
  .plan .badge { position:absolute; top:-13px; left:24px; background:var(--lime); color:var(--night); font-size:13px; font-weight:800; border-radius:999px; padding:4px 11px; }
  .plan h4 { margin:0 0 8px; font:700 18px var(--display); color:var(--forest); }
  .plan .was { display:block; font:600 16px var(--display); color:var(--muted, #6b7a70); text-decoration:line-through; margin-bottom:2px; }
  .promo { display:table; margin:-6px auto 22px; background:var(--lime); color:var(--night); font-weight:800; border-radius:999px; padding:8px 18px; }
  .price { font:800 42px/1 var(--display); color:var(--ink); letter-spacing:-.03em; }
  .per { color:var(--muted); font-size:15px; margin-top:6px; }
  .save { color:var(--leaf); font-weight:700; font-size:14.5px; min-height:24px; margin-top:2px; }
  .plan .note { flex:1; }
  .addon { margin-top:18px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 22px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; text-align:left; }
  .addon b { color:var(--forest); }
  .note { font-size:14.5px; color:var(--muted); margin-top:16px; }

  /* ---------- descarga */
  .dl { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:center; background:var(--forest); color:#fff; border-radius:24px; padding:44px; }
  .dl h2 { color:#fff; }
  .dl .sub { color:#C3D5C0; margin:14px 0 0; }
  .dl ol { margin:18px 0 0; padding-left:20px; color:#DCE9D9; font-size:15.5px; display:grid; gap:4px; }
  .dl .btn.p { font-size:18px; padding:17px 28px; }
  .ver { font-size:14.5px; color:#C3D5C0; margin-top:10px; }

  /* ---------- preguntas */
  .faq { max-width:820px; margin:36px auto 0; border-top:1px solid var(--line); }
  details { border-bottom:1px solid var(--line); padding:18px 4px; }
  summary { cursor:pointer; font-weight:700; font-size:17.5px; color:var(--ink); list-style:none; display:flex; justify-content:space-between; gap:16px; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"+"; color:var(--leaf); font:700 24px/1 "Manrope", system-ui, sans-serif; }
  details[open] summary::after { content:"−"; }
  details p { color:var(--muted); margin:10px 0 0; max-width:44em; }

  .contact { background:var(--limesoft); border-radius:24px; padding:38px 42px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; }
  .contact p { color:var(--forest); margin-top:8px; }
  footer { background:var(--night); color:#B9CDB6; padding:44px 0 28px; font-size:14.5px; margin-top:88px; }
  footer .wrap { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:28px; }
  footer b { color:#fff; display:block; margin-bottom:8px; }
  footer a { color:#B9CDB6; text-decoration:none; display:block; margin:5px 0; } footer a:hover { color:#fff; }
  .copy { text-align:center; color:#8FA88C; font-size:13px; margin-top:30px; }

  @media (max-width:920px) {
    nav.links { display:none; position:absolute; top:64px; left:0; right:0; background:var(--forest); flex-direction:column; padding:16px 20px; gap:14px; border-top:1px solid rgba(255,255,255,.12); }
    nav.links.open { display:flex; } .burger { display:block; }
    .right .btn { display:none; }
    .hero { padding:44px 0 64px; }
    .hero .wrap, .feat, .feat.rev, .botgrid, .dl, .contact { grid-template-columns:1fr; }
    .feat { gap:28px; } .feat.rev .txt { order:0; }
    .stage { min-height:0; margin-top:10px; }
    .notebook { width:76%; left:0; top:-8px; padding-left:46px; }
    .notebook::before { left:34px; }
    .notebook .nb { font-size:15px; } .notebook .nb-h { font-size:18px; }
    .screen-shot { margin-left:18%; margin-top:200px; }
    .also { grid-template-columns:1fr; }
    .plans { grid-template-columns:1fr; }
    .dl { padding:30px 24px; } .contact { padding:28px 24px; }
    footer .wrap { grid-template-columns:1fr 1fr; }
    .phone { width:100%; max-width:340px; }
    section { padding:64px 0; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#"><img src="icono.png" alt="">Lima Gestor</a>
  <nav class="links" id="nav">
    <a href="#funciones" data-t="nav_feat"></a>
    <a href="#rubros" data-t="nav_rub"></a>
    <a href="#bot" data-t="nav_bot"></a>
    <a href="#videos" data-t="nav_vid"></a>
    <a href="#planes" data-t="nav_plans"></a>
    <a href="#preguntas" data-t="nav_faq"></a>
    <a href="#descargar" data-t="nav_dl"></a>
  </nav>
  <div class="right">
    <div class="lang"><button data-set="es">ES</button><button data-set="pt">PT</button><button data-set="en">EN</button></div>
    <a class="btn p sm" href="#descargar" data-t="cta_try"></a>
    <button class="burger" id="burger" aria-label="menu">☰</button>
  </div>
</div></header>

<div class="hero"><div class="wrap">
  <div>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="btns">
      <a class="btn p" href="#descargar" data-t="cta_try"></a>
      <a class="btn ghost" data-wa data-t="cta_wa"></a>
    </div>
    <p class="fine" data-t="fine" data-html></p>
    <p id="refbox" hidden></p>
  </div>
  <div class="stage" aria-hidden="true">
    <div class="notebook">
      <div class="nb-h" data-t="nb_h"></div>
      <div class="nb"><s data-t="nb_1"></s></div>
      <div class="nb"><s data-t="nb_2"></s></div>
      <div class="nb"><s data-t="nb_3"></s></div>
      <div class="nb q" data-t="nb_4"></div>
    </div>
    <div class="screen-shot"><img data-img="venta" alt="Lima Gestor"></div>
  </div>
</div></div>

<section id="funciones"><div class="wrap">
  <div class="center head"><h2 data-t="f_title"></h2><p class="sub" data-t="f_sub"></p></div>
  <div class="feat" id="f-venta">
    <div class="txt"><h3 data-t="v_t"></h3><p data-t="v_p"></p>
      <ul class="ticks"><li data-t="v_1"></li><li data-t="v_2"></li><li data-t="v_3"></li><li data-t="v_4"></li></ul></div>
    <div class="frame"><img data-img="venta" alt="" loading="lazy"></div>
  </div>
  <div class="feat rev" id="f-stock">
    <div class="txt"><h3 data-t="s_t"></h3><p data-t="s_p"></p>
      <ul class="ticks"><li data-t="s_1"></li><li data-t="s_2"></li><li data-t="s_3"></li><li data-t="s_4"></li></ul></div>
    <div class="frame"><img data-img="productos" alt="" loading="lazy"></div>
  </div>
  <div class="feat" id="f-fiado">
    <div class="txt"><h3 data-t="c_t"></h3><p data-t="c_p"></p>
      <ul class="ticks"><li data-t="c_1"></li><li data-t="c_2"></li><li data-t="c_3"></li></ul></div>
    <div class="frame"><img data-img="fiado" alt="" loading="lazy"></div>
  </div>
  <div class="feat rev" id="f-caja">
    <div class="txt"><h3 data-t="k_t"></h3><p data-t="k_p"></p>
      <ul class="ticks"><li data-t="k_1"></li><li data-t="k_2"></li><li data-t="k_3"></li></ul></div>
    <div class="frame"><img data-img="caja" alt="" loading="lazy"></div>
  </div>
</div></section>

<section id="videos" style="padding-top:20px"><div class="wrap vids">

  m10_t: ["Video guía en cada ventana", "Vídeo guia em cada janela", "A video guide in every window"], m10_p: ["Un botón te lleva al video de esa pantalla. La lista completa está en Ayuda → Videos; los publicamos poco a poco.", "Um botão leva ao vídeo daquela tela. A lista completa fica em Ajuda → Vídeos; publicamos aos poucos.", "A button takes you to that screen's video. The full list is in Help → Videos; we publish them little by little."],
  m11_t: ["Catálogo web con QR", "Catálogo web com QR", "Web catalog with QR"], m11_p: ["Cada tienda tiene su enlace y su QR. El cliente ve los productos, pide o pide cotización, sin el bot. Si no hay internet, el pedido no se pierde: llega a Pedidos o a Cotizaciones.", "Cada loja tem seu link e seu QR. O cliente vê os produtos, pede ou pede orçamento, sem o robô. Se não houver internet, o pedido não se perde: chega em Pedidos ou em Cotizações.", "Each store has its link and QR. The customer sees the products, orders or requests a quote, without the bot. If there's no internet, the order is not lost: it arrives under Orders or Quotes."],
  seg_t: ["Para todo tipo de tienda", "Para todo tipo de loja", "For every kind of store"], seg_sub: ["Si vendes productos con stock, Lima Gestor es para ti.", "Se você vende produtos com estoque, o Lima Gestor é para você.", "If you sell products with stock, Lima Gestor is for you."],

  p_sub: ["Todas las funciones del programa en todos los planes. El bot de WhatsApp y otros complementos se pagan aparte. Prueba 15 días gratis y paga recién si te sirve.", "Todas as funções do programa em todos os planos. O robô de WhatsApp e outros complementos são pagos à parte. Teste 15 dias grátis e pague só se servir.", "Every program feature on every plan. The WhatsApp bot and other add-ons are paid separately. Try 15 days free and pay only if it works for you."],

  p_bot_soon: ["En fase de pruebas · saldrá próximamente con promoción para quienes ya compraron Lima Gestor.", "Em fase de testes · sairá em breve com promoção para quem já comprou o Lima Gestor.", "In testing · launches soon with a promo for existing Lima Gestor customers."],
  p_bot_price: ["{m} al mes · {s} semestral · {a} anual", "{m} por mês · {s} semestral · {a} anual", "{m} a month · {s} for 6 months · {a} a year"],
  p_note: ["Los planes son por el programa: 1 tienda y 1 computadora. ¿Más computadoras en la misma tienda? Cada una suma {x_m} al mes ({x_s} semestral, {x_a} anual) y usa el mismo stock. ¿Otra tienda? Escríbenos por WhatsApp. El bot de WhatsApp, la instalación asistida y la facturación electrónica de terceros son complementos que se pagan aparte. Pagos por Yape/Plin (Perú) o PIX (Brasil).", "Os planos são pelo programa: 1 loja e 1 computador. Mais computadores na mesma loja? Cada um soma {x_m} por mês ({x_s} semestral, {x_a} anual) e usa o mesmo estoque. Outra loja? Fale conosco no WhatsApp. O robô de WhatsApp, a instalação assistida e a emissão de notas de terceiros são complementos pagos à parte. Pagamento por PIX (Brasil) ou Yape/Plin (Peru).", "Plans cover the program: 1 store and 1 computer. More computers in the same store? Each adds {x_m} a month ({x_s} for 6 months, {x_a} a year) and shares the same stock. Another store? Message us on WhatsApp. The WhatsApp bot, assisted setup and third-party e-invoicing are add-ons paid separately. Payment by Yape/Plin (Peru) or PIX (Brazil)."],

  rb_sub: ["Te decimos con honestidad qué hace hoy en cada rubro y qué todavía no.", "Dizemos com honestidade o que faz hoje em cada segmento e o que ainda não.", "We tell you honestly what it does today for each business type and what it doesn't yet."],
  rb_yes: ["Qué hace hoy", "O que faz hoje", "What it does today"],
  rb_no: ["Qué le falta", "O que falta", "What's missing"],
  rb_faq: ["Preguntas de este rubro", "Perguntas deste segmento", "Questions about this business type"],
  rb_notify: ["Avísame si lo hacen para mi rubro", "Avise-me se fizerem para o meu segmento", "Let me know if you build it for my business type"],
  rb_wa: ["Hola, tengo un negocio de {r} y me interesa Lima Gestor. Avísame cuando tenga las funciones de mi rubro.", "Olá, tenho um negócio de {r} e tenho interesse no Lima Gestor. Avise-me quando tiver as funções do meu segmento.", "Hi, I run a {r} business and I'm interested in Lima Gestor. Let me know when it has the features for my business type."],
  rubros: [[{"id": "tiendas", "name": "Tiendas de productos", "st": "ok", "stt": "Sirve hoy", "lead": "Bodegas, minimarkets, licorerías, ferreterías, librerías, boticas, cosméticos, artículos para mascotas, juguetes y celulares: para esto está hecho Lima Gestor.", "yes": ["Ventas rápidas con lector de código de barras", "Stock con alertas de mínimo y vencimientos", "Cuaderno de fiados con cobro por WhatsApp", "Caja con cierre en PDF, compras, cotizaciones, garantías y etiquetas", "Funciona sin internet y con copia de seguridad automática"], "no": ["En Perú no emite boleta ni factura electrónica: se emite aparte con SUNAT", "En Brasil emite NFC-e con Focus NFe, que se contrata aparte"], "faq": [["¿Necesito un lector de códigos?", "No es obligatorio, pero con lector vendes mucho más rápido (desde S/ 40). También puedes escribir el nombre del producto o usar la cámara."], ["¿Funciona sin internet?", "Sí. Ventas, stock, fiados y caja funcionan sin conexión."]]}, {"id": "moda", "name": "Moda y boutiques", "st": "lim", "stt": "Sirve con límites", "lead": "Ropa, calzado y accesorios. Sirve si manejas pocas tallas y colores; todavía no está hecho para grandes cantidades de variantes.", "yes": ["Etiquetas con código de barras por prenda", "Devoluciones, cambios y garantías", "Clientes fieles con un descuento automático que el cajero acepta", "Compras a proveedores y fiado", "Precio por mayor para revendedores"], "no": ["No tiene tallas y colores dentro de un mismo producto: se registra cada talla y color como un producto con su código (ej.: «Polo azul M»)", "Aún no hay apartado (separar con adelanto) ni consignación", "No junta el stock de varias tiendas en un solo reporte"], "faq": [["¿Puedo manejar tallas y colores?", "Sí, creando un producto por cada talla y color, con su propio código y etiqueta. Funciona bien con pocas variantes; con muchas, el catálogo se vuelve largo."], ["¿Y los cambios de talla?", "Registras la devolución y vendes la prenda nueva: el stock de las dos se ajusta solo."]]}, {"id": "cafeteria", "name": "Cafeterías", "st": "lim", "stt": "Sirve con límites", "lead": "Cafeterías de mostrador, kioscos y panaderías-cafetería donde se pide y se paga en caja.", "yes": ["Venta rápida con botones de acceso rápido para lo más vendido", "Caja con cierre y arqueo, y varios cajeros", "Stock de productos e insumos con alertas", "Clientes fieles y fiado", "Funciona sin internet"], "no": ["No envía comandas a cocina o barra ni tiene pantalla de cocina", "No descuenta insumos por receta (cada producto se vende como un ítem)", "No tiene mesas, propinas ni carta con QR"], "faq": [["¿Puedo vender combos?", "Sí, como un producto con su precio (por ejemplo «Café + pan»). El descuento de insumos por receta aún no existe."], ["¿Sirve para delivery?", "Puedes vender y cobrar, pero no hay integración con apps de delivery."]]}, {"id": "restaurante", "name": "Restaurantes", "st": "no", "stt": "Aún no disponible", "lead": "Hoy Lima Gestor no es la mejor opción para un restaurante con mesas: le faltan las funciones centrales de ese rubro.", "yes": ["Sirve para vender por mostrador o para llevar (mira Cafeterías)"], "no": ["Mesas y cuentas abiertas", "Comandas a cocina y barra, y pantalla de cocina", "División de cuenta y propinas", "Recetas y costo por plato", "Delivery y carta con QR"], "faq": [["¿Cuándo estará?", "No hay fecha. Si te interesa, escríbenos y te avisamos si se programa: no queremos venderte algo que todavía no existe."]]}, {"id": "gimnasio", "name": "Gimnasios", "st": "no", "stt": "Aún no disponible", "lead": "Hoy Lima Gestor no controla membresías ni accesos. Sirve solo para vender productos del gimnasio (agua, suplementos, ropa).", "yes": ["Vender productos en caja, con stock y fiado"], "no": ["Membresías con vencimiento y cobro recurrente", "Control de asistencia o acceso con QR o DNI, y bloqueo por deuda", "Clases y reservas con cupos", "App del socio y avisos automáticos de vencimiento"], "faq": [["¿Puedo cobrar la mensualidad como un producto?", "Puedes registrar el pago como una venta, pero el programa no controla quién está al día ni cuándo vence: tendrías que llevarlo a mano."], ["¿Cuándo estará?", "No hay fecha. Escríbenos si te interesa y te avisamos."]]}], [{"id": "tiendas", "name": "Lojas de produtos", "st": "ok", "stt": "Serve hoje", "lead": "Mercadinhos, minimercados, adegas, ferragens, papelarias, farmácias, cosméticos, artigos para pets, brinquedos e celulares: é para isso que o Lima Gestor foi feito.", "yes": ["Vendas rápidas com leitor de código de barras", "Estoque com alertas de mínimo e validade", "Caderneta de fiado com cobrança pelo WhatsApp", "Caixa com fechamento em PDF, compras, orçamentos, garantias e etiquetas", "Funciona sem internet e com cópia de segurança automática"], "no": ["No Brasil emite NFC-e com a Focus NFe, que se contrata à parte", "No Peru não emite nota eletrônica: é emitida à parte com a SUNAT"], "faq": [["Preciso de um leitor de código?", "Não é obrigatório, mas com leitor você vende bem mais rápido (a partir de R$ 60). Também pode digitar o nome do produto ou usar a câmera."], ["Funciona sem internet?", "Sim. Vendas, estoque, fiado e caixa funcionam sem conexão."]]}, {"id": "moda", "name": "Moda e boutiques", "st": "lim", "stt": "Serve com limites", "lead": "Roupas, calçados e acessórios. Serve se você trabalha com poucos tamanhos e cores; ainda não é feito para grandes quantidades de variações.", "yes": ["Etiquetas com código de barras por peça", "Devoluções, trocas e garantias", "Clientes fiéis com um desconto automático que o caixa aceita", "Compras de fornecedores e fiado", "Preço de atacado para revendedores"], "no": ["Não tem tamanhos e cores dentro de um mesmo produto: cada tamanho e cor é cadastrado como um produto com seu código (ex.: «Camiseta azul M»)", "Ainda não há reserva com sinal nem condicional", "Não junta o estoque de várias lojas em um só relatório"], "faq": [["Posso trabalhar com tamanhos e cores?", "Sim, criando um produto para cada tamanho e cor, com código e etiqueta próprios. Funciona bem com poucas variações; com muitas, o catálogo fica longo."], ["E as trocas de tamanho?", "Você registra a devolução e vende a peça nova: o estoque das duas se ajusta sozinho."]]}, {"id": "cafeteria", "name": "Cafeterias", "st": "lim", "stt": "Serve com limites", "lead": "Cafeterias de balcão, quiosques e padarias-cafeteria onde se pede e se paga no caixa.", "yes": ["Venda rápida com botões de acesso rápido para os mais vendidos", "Caixa com fechamento e conferência, e vários operadores", "Estoque de produtos e insumos com alertas", "Clientes fiéis e fiado", "Funciona sem internet"], "no": ["Não envia comandas para cozinha ou bar nem tem tela de cozinha", "Não baixa insumos por receita (cada produto é vendido como um item)", "Não tem mesas, gorjeta nem cardápio com QR"], "faq": [["Posso vender combos?", "Sim, como um produto com preço próprio (por exemplo «Café + pão»). A baixa de insumos por receita ainda não existe."], ["Serve para delivery?", "Você pode vender e cobrar, mas não há integração com apps de delivery."]]}, {"id": "restaurante", "name": "Restaurantes", "st": "no", "stt": "Ainda não disponível", "lead": "Hoje o Lima Gestor não é a melhor opção para um restaurante com mesas: faltam as funções centrais desse segmento.", "yes": ["Serve para vender no balcão ou para viagem (veja Cafeterias)"], "no": ["Mesas e comandas abertas", "Pedidos para cozinha e bar, e tela de cozinha", "Divisão de conta e gorjeta", "Receitas e custo por prato", "Delivery e cardápio com QR"], "faq": [["Quando vai ter?", "Não há data. Se tiver interesse, fale conosco e avisamos se for programado: não queremos vender algo que ainda não existe."]]}, {"id": "gimnasio", "name": "Academias", "st": "no", "stt": "Ainda não disponível", "lead": "Hoje o Lima Gestor não controla mensalidades nem acessos. Serve só para vender produtos da academia (água, suplementos, roupas).", "yes": ["Vender produtos no caixa, com estoque e fiado"], "no": ["Mensalidades com vencimento e cobrança recorrente", "Controle de presença ou acesso por QR ou CPF, e bloqueio por inadimplência", "Aulas e reservas com vagas", "App do aluno e avisos automáticos de vencimento"], "faq": [["Posso cobrar a mensalidade como um produto?", "Pode registrar o pagamento como uma venda, mas o programa não controla quem está em dia nem quando vence: seria preciso fazer à mão."], ["Quando vai ter?", "Não há data. Fale conosco se tiver interesse e avisamos."]]}], [{"id": "tiendas", "name": "Product stores", "st": "ok", "stt": "Works today", "lead": "Corner stores, minimarkets, liquor stores, hardware, stationery, pharmacies, cosmetics, pet supplies, toys and phone shops: this is what Lima Gestor is built for.", "yes": ["Fast sales with a barcode scanner", "Stock with low-stock and expiry alerts", "Store-credit book with WhatsApp reminders", "Register with PDF closing, purchases, quotes, warranties and labels", "Works offline with automatic backups"], "no": ["In Peru it doesn't issue electronic invoices: those are issued separately with SUNAT", "In Brazil it issues NFC-e through Focus NFe, hired separately"], "faq": [["Do I need a barcode scanner?", "Not required, but with one you sell much faster. You can also type the product name or use the camera."], ["Does it work offline?", "Yes. Sales, stock, store credit and the register work offline."]]}, {"id": "moda", "name": "Fashion and boutiques", "st": "lim", "stt": "Works with limits", "lead": "Clothing, shoes and accessories. It works if you handle few sizes and colors; it isn't built for large numbers of variants yet.", "yes": ["Barcode labels per garment", "Returns, exchanges and warranties", "Loyal customers with an automatic discount the cashier accepts", "Supplier purchases and store credit", "Wholesale price for resellers"], "no": ["No sizes and colors inside one product: each size and color is registered as a product with its own code (e.g. “Blue tee M”)", "No layaway (hold with a deposit) or consignment yet", "It doesn't combine the stock of several stores in one report"], "faq": [["Can I handle sizes and colors?", "Yes, by creating one product per size and color, each with its own code and label. It works well with few variants; with many, the catalog gets long."], ["What about size exchanges?", "You record the return and sell the new item: stock for both adjusts by itself."]]}, {"id": "cafeteria", "name": "Cafés", "st": "lim", "stt": "Works with limits", "lead": "Counter-service cafés, kiosks and bakery-cafés where customers order and pay at the till.", "yes": ["Fast selling with quick-access buttons for your best sellers", "Register with closing and cash count, and several cashiers", "Stock of products and supplies with alerts", "Loyal customers and store credit", "Works offline"], "no": ["No kitchen or bar tickets and no kitchen screen", "No recipe-based supply deduction (each product sells as one item)", "No tables, tips or QR menu"], "faq": [["Can I sell combos?", "Yes, as a product with its own price (e.g. “Coffee + bread”). Recipe-based supply deduction doesn't exist yet."], ["Is it good for delivery?", "You can sell and charge, but there's no integration with delivery apps."]]}, {"id": "restaurante", "name": "Restaurants", "st": "no", "stt": "Not available yet", "lead": "Today Lima Gestor isn't the best choice for a table-service restaurant: it lacks that business type's core features.", "yes": ["Works for counter or takeaway sales (see Cafés)"], "no": ["Tables and open tabs", "Kitchen and bar tickets, and a kitchen screen", "Bill splitting and tips", "Recipes and cost per dish", "Delivery and QR menu"], "faq": [["When will it be available?", "There's no date. If you're interested, message us and we'll tell you if it gets scheduled: we don't want to sell you something that doesn't exist yet."]]}, {"id": "gimnasio", "name": "Gyms", "st": "no", "stt": "Not available yet", "lead": "Today Lima Gestor doesn't manage memberships or access. It only works for selling the gym's products (water, supplements, apparel).", "yes": ["Selling products at the till, with stock and store credit"], "no": ["Memberships with expiry and recurring billing", "Attendance or access control with QR or ID, and blocking for unpaid dues", "Classes and bookings with limited spots", "Member app and automatic expiry reminders"], "faq": [["Can I charge the monthly fee as a product?", "You can record the payment as a sale, but the program doesn't track who is up to date or when it expires: you'd have to do that by hand."], ["When will it be available?", "There's no date. Message us if you're interested and we'll let you know."]]}]],
  d_eb: ["Descarga", "Download", "Download"], d_t: ["Descarga Lima Gestor y pruébalo 15 días gratis", "Baixe o Lima Gestor e teste 15 dias grátis", "Download Lima Gestor and try it free for 15 days"],
  d_p: ["Se instala en un par de minutos. Al terminar la prueba eliges tu plan; tus datos se quedan.", "Instala em poucos minutos. Ao terminar o teste você escolhe seu plano; seus dados ficam.", "Installs in a couple of minutes. When the trial ends you pick a plan; your data stays."],
  d_1: ["Descarga el instalador y ábrelo.", "Baixe o instalador e abra.", "Download the installer and open it."],
  d_2: ["Si Windows muestra “Windows protegió tu PC”, toca “Más información” → “Ejecutar de todas formas”.", "Se o Windows mostrar “O Windows protegeu o computador”, toque em “Mais informações” → “Executar assim mesmo”.", "If Windows shows “Windows protected your PC”, tap “More info” → “Run anyway”."],
  d_3: ["Crea tu tienda y empieza a vender. ¿Dudas? Te ayudamos por WhatsApp.", "Crie sua loja e comece a vender. Dúvidas? Ajudamos pelo WhatsApp.", "Create your store and start selling. Questions? We help on WhatsApp."],

  d_prog: ["Descargando… {p}%", "Baixando… {p}%", "Downloading… {p}%"], d_ok: ["¡Listo! Abre el archivo descargado.", "Pronto! Abra o arquivo baixado.", "Done! Open the downloaded file."],
  d_err: ["No se pudo descargar. Revisa tu internet e intenta de nuevo, o escríbenos por WhatsApp.", "Não foi possível baixar. Verifique sua internet e tente de novo, ou fale conosco no WhatsApp.", "Download failed. Check your connection and try again, or message us on WhatsApp."], d_soon: ["Próximamente", "Em breve", "Coming soon"],

  d_1s: ["Toca «Instalar desde Microsoft Store» y luego «Obtener». Es gratis.", "Toque em «Instalar pela Microsoft Store» e depois em «Obter». É grátis.", "Tap «Get it from Microsoft Store», then «Get». It's free."],
  d_2s: ["Se instala sin advertencias de Windows y se actualiza solo.", "Instala sem avisos do Windows e se atualiza sozinho.", "Installs with no Windows warnings and updates by itself."],
  d_vers: ["Versión {v} · Microsoft Store", "Versão {v} · Microsoft Store", "Version {v} · Microsoft Store"],
  d_direct: ["¿Tu PC no tiene Microsoft Store? Descarga directa", "Seu PC não tem Microsoft Store? Download direto", "No Microsoft Store on your PC? Direct download"],
  d_direct_n: ["Windows puede mostrar un aviso: «Más información» → «Ejecutar de todas formas».", "O Windows pode mostrar um aviso: «Mais informações» → «Executar assim mesmo».", "Windows may show a warning: «More info» → «Run anyway»."],
  d_req: ["Windows 10 u 11 · 4 GB de RAM o más", "Windows 10 ou 11 · 4 GB de RAM ou mais", "Windows 10 or 11 · 4 GB RAM or more"],
  q_t: ["Preguntas frecuentes", "Perguntas frequentes", "Frequently asked questions"],
  faq: [
    [["¿Funciona sin internet?", "Sí. Ventas, stock, fiados y caja funcionan sin conexión. Internet solo se usa para el bot de WhatsApp, para buscar el nombre de un producto por su código y para activar la licencia."],
     ["Funciona sem internet?", "Sim. Vendas, estoque, fiado e caixa funcionam sem conexão. A internet só é usada para o robô de WhatsApp, para buscar o nome de um produto pelo código e para ativar a licença."],
     ["Does it work without internet?", "Yes. Sales, stock, store credit and the register work offline. Internet is only used for the WhatsApp bot, to look up a product name by barcode and to activate the license."]],
    [["¿Gano algo si recomiendo Lima Gestor?", "Sí: 1 mes gratis por cada tienda nueva que pague su primera licencia con tu código, hasta un máximo de 5 meses gratis. Tu código está en Configuración → Licencia → Recomienda y gana, con un botón para enviarlo por WhatsApp. El mes se suma solo a tu licencia."], ["Ganho algo se indicar o Lima Gestor?", "Sim: 1 mês grátis para cada loja nova que pagar a primeira licença com o seu código, até no máximo 5 meses grátis. Seu código fica em Configurações → Licença → Indique e ganhe, com um botão para enviar pelo WhatsApp. O mês é somado sozinho à sua licença."], ["Do I get anything for referring Lima Gestor?", "Yes: 1 free month for every new store that pays its first license with your code, up to a maximum of 5 free months. Your code is in Settings → License → Refer and earn, with a button to send it on WhatsApp. The month is added to your license automatically."]],
    [["¿Qué incluye el plan y qué se paga aparte?", "El plan es solo por el programa Lima Gestor: 1 tienda y 1 computadora, con todas sus funciones, las actualizaciones y el soporte por WhatsApp. Se paga aparte: cada computadora adicional de la misma tienda ({x_m} al mes), el bot de WhatsApp (con Lima IA Pro), la instalación asistida, la facturación electrónica de terceros (por ejemplo Focus NFe en Brasil; en Perú la boleta o factura electrónica se emite con SUNAT) y el hardware (lector, impresora)."], ["O que inclui o plano e o que se paga à parte?", "O plano é só pelo programa Lima Gestor: 1 loja e 1 computador, com todas as funções, as atualizações e o suporte pelo WhatsApp. Paga-se à parte: cada computador adicional da mesma loja ({x_m} por mês), o robô de WhatsApp (com Lima IA Pro), a instalação assistida, a emissão de notas de terceiros (por exemplo Focus NFe no Brasil) e o hardware (leitor, impressora)."], ["What does the plan include and what is paid separately?", "The plan covers the Lima Gestor program only: 1 store and 1 computer, with all its features, updates and WhatsApp support. Paid separately: each additional computer in the same store ({x_m} a month), the WhatsApp bot (with Lima AI Pro), assisted setup, third-party e-invoicing (for example Focus NFe in Brazil; in Peru electronic invoices are issued with SUNAT) and hardware (scanner, printer)."]],
    [["¿Por qué en el programa veo un precio distinto al de esta página?", "En esta página ves el precio de 1 computadora. Si tu plan incluye más computadoras, se suma el precio de cada computadora adicional (por ejemplo, con 2 computadoras: la licencia más una computadora adicional). Si hay un descuento vigente, se aplica a todo el plan y se muestra con su porcentaje y su fecha de fin antes de que pagues."], ["Por que no programa vejo um preço diferente do desta página?", "Nesta página você vê o preço de 1 computador. Se o seu plano inclui mais computadores, soma-se o preço de cada computador adicional (por exemplo, com 2 computadores: a licença mais um computador adicional). Se houver um desconto vigente, ele vale para todo o plano e aparece com a porcentagem e a data de fim antes de você pagar."], ["Why do I see a different price in the program than on this page?", "This page shows the price for 1 computer. If your plan includes more computers, the price of each additional computer is added (for example, with 2 computers: the license plus one additional computer). If a discount is active, it applies to the whole plan and is shown with its percentage and end date before you pay."]],
    [["¿Sirve para gimnasios, cafeterías, restaurantes o tiendas de ropa?", "Depende: sirve con límites para tiendas de ropa y cafeterías de mostrador, y todavía no sirve para restaurantes con mesas ni para gimnasios con membresías. En la sección «Para qué negocios sirve hoy» te decimos qué hace y qué le falta a cada rubro."], ["Serve para academias, cafeterias, restaurantes ou lojas de roupa?", "Depende: serve com limites para lojas de roupa e cafeterias de balcão, e ainda não serve para restaurantes com mesas nem para academias com mensalidades. Na seção «Para quais negócios serve hoje» dizemos o que faz e o que falta em cada segmento."], ["Is it good for gyms, cafés, restaurants or clothing stores?", "It depends: it works with limits for clothing stores and counter-service cafés, and it isn't ready yet for table-service restaurants or gyms with memberships. In the “Which businesses it fits today” section we say what it does and what's missing for each business type."]],
    [["¿Cómo funciona la prueba gratis?", "Instalas y usas todas las funciones por 15 días, también el bot de WhatsApp, sin tarjeta. Si te sirve, eliges un plan y pagas por Yape/Plin o PIX; la licencia se activa sola. Si no, no pagas nada."],
     ["Como funciona o teste grátis?", "Você instala e usa todas as funções por 15 dias, também o robô de WhatsApp, sem cartão. Se servir, escolhe um plano e paga por PIX; a licença ativa sozinha. Se não, não paga nada."],
     ["How does the free trial work?", "Install and use every feature for 15 days, the WhatsApp bot included, no card needed. If it works for you, pick a plan and pay by Yape/Plin or PIX; the license activates by itself. If not, you pay nothing."]],
    [["¿Mis datos están seguros?", "Tu información se guarda en tu computadora. Hay copia al cerrar la caja y cada 4 horas si hubo cambios, en tu PC y —si lo activas— en tu OneDrive o Google Drive. Lima Softwares no tiene acceso a tus ventas ni a tus clientes."],
     ["Meus dados estão seguros?", "Suas informações ficam no seu computador. Há cópia ao fechar o caixa e a cada 4 horas se houve mudanças, no seu PC e —se você ativar— no OneDrive ou Google Drive. A Lima Softwares não tem acesso às suas vendas nem aos seus clientes."],
     ["Is my data safe?", "Your information stays on your computer. There's a backup when you close the register and every 4 hours if anything changed, on your PC and —if you turn it on— in OneDrive or Google Drive. Lima Softwares has no access to your sales or customers."]],
    [["¿Qué pasa si me roban o se malogra la computadora?", "En la primera pantalla elige «Recuperar mi tienda desde una copia». Con la copia de la nube (o un USB) vuelves a tener tus productos, ventas y clientes. La licencia está atada a esa PC: el programa te ayuda a pedir el traslado a la nueva."],
     ["O que acontece se roubarem ou o computador quebrar?", "Na primeira tela escolha «Recuperar minha loja de uma cópia». Com a cópia da nuvem (ou um USB) você volta a ter produtos, vendas e clientes. A licença fica ligada àquele PC: o programa ajuda a pedir a transferência para o novo."],
     ["What if the computer is stolen or breaks?", "On the first screen choose “Recover my store from a backup”. With the cloud copy (or a USB) you get your products, sales and customers back. The license is tied to that PC: the program helps you request the transfer to the new one."]],
    [["¿Emite boleta o factura electrónica?", "En Brasil sí: emite la NFC-e de cada venta a través de Focus NFe (la tienda contrata Focus NFe aparte, desde R$ 62,90/mes, y registra ahí su certificado digital). En Perú todavía no: Lima Gestor entrega comprobantes internos en PDF (con IGV desglosado); la boleta o factura electrónica la emites por tu cuenta con SUNAT."],
     ["Emite NFC-e ou nota fiscal?", "Sim, a NFC-e: em cada venda o Lima Gestor emite a nota pela Focus NFe (a loja contrata a Focus NFe à parte, a partir de R$ 62,90/mês, e cadastra lá o certificado digital). Sem internet, a nota fica na fila e é enviada sozinha depois. MEI não é obrigado a emitir NFC-e."],
     ["Does it issue electronic invoices?", "In Brazil, yes: it issues each sale's NFC-e through Focus NFe (the store hires Focus NFe separately). In Peru not yet: Lima Gestor issues internal PDF receipts; you issue the electronic invoice yourself with SUNAT."]],
    [["¿Y si no tengo lector de códigos?", "Puedes leer los códigos con la cámara de la computadora o del celular que usas como caja. Ojo: cámaras básicas, sin enfoque automático o con poca luz muchas veces no leen códigos pequeños; para vender rápido, un lector USB o Bluetooth (desde S/ 40) es mucho mejor. Lima Gestor necesita una computadora con Windows como principal: un celular solo no puede ser la principal."],
     ["E se eu não tiver leitor de código?", "Dá para ler os códigos com a câmera do computador ou do celular que você usa como caixa. Atenção: câmeras simples, sem foco automático ou com pouca luz muitas vezes não leem códigos pequenos; para vender rápido, um leitor USB ou Bluetooth (a partir de R$ 60) é muito melhor. O Lima Gestor precisa de um computador com Windows como principal: um celular sozinho não pode ser o principal."],
     ["What if I don't have a barcode scanner?", "You can scan barcodes with the camera of the computer or the phone you use as a register. Note: basic cameras, without autofocus or in low light often can't read small barcodes; a USB or Bluetooth scanner is much faster. Lima Gestor needs a Windows computer as the main one: a phone alone can't be the main computer."]],
    [["¿Necesito una computadora potente?", "No. Funciona en cualquier PC con Windows 10 u 11 y 4 GB de RAM. Puedes usar un lector de códigos USB y una impresora de tickets o normal."],
     ["Preciso de um computador potente?", "Não. Funciona em qualquer PC com Windows 10 ou 11 e 4 GB de RAM. Você pode usar um leitor USB e uma impressora térmica ou comum."],
     ["Do I need a powerful computer?", "No. It runs on any PC with Windows 10 or 11 and 4 GB RAM. You can use a USB barcode scanner and a receipt or regular printer."]],
    [["¿Puedo pasar mis productos de otro sistema o de Excel?", "Sí. Descargas la plantilla de Excel, pegas tus productos y los importas de una vez. También te ayudamos por WhatsApp."],
     ["Posso trazer meus produtos de outro sistema ou do Excel?", "Sim. Baixe o modelo de Excel, cole seus produtos e importe de uma vez. Também ajudamos pelo WhatsApp."],
     ["Can I bring my products from another system or Excel?", "Yes. Download the Excel template, paste your products and import them at once. We also help on WhatsApp."]],
    [["¿Qué pasa si vence mi licencia?", "El programa queda en solo lectura: puedes ver y exportar todo, pero no registrar ventas nuevas. Tus datos no se borran. Al renovar, sigue igual."],
     ["O que acontece se a licença vencer?", "O programa fica só para consulta: você pode ver e exportar tudo, mas não registrar vendas novas. Seus dados não são apagados. Ao renovar, segue igual."],
     ["What happens if my license expires?", "The program goes read-only: you can view and export everything but not record new sales. Your data isn't deleted. Renew and it carries on."]],
    [["¿Puedo usarlo en varias computadoras?", "Sí. Una computadora es la principal y guarda los datos; las demás de la tienda se conectan a ella por el mismo WiFi o, si están en otra red, con el código de la tienda. Tú apruebas cada una y todas ven el mismo stock, ventas y caja al momento. Cada computadora extra se paga aparte y se compra desde el programa. Para otra tienda, escríbenos."],
     ["Posso usar em vários computadores?", "Sim. Um computador é o principal e guarda os dados; os outros da loja se conectam a ele pelo mesmo Wi-Fi ou, se estiverem em outra rede, com o código da loja. Você aprova cada um e todos veem o mesmo estoque, vendas e caixa na hora. Cada computador extra é pago à parte e comprado pelo programa. Para outra loja, fale conosco."],
     ["Can I use it on several computers?", "Yes. One computer is the main one and keeps the data; the store's other computers connect to it over the same Wi-Fi or, from another network, with the store code. You approve each one and they all see the same stock, sales and register in real time. Each extra computer is paid separately and bought from the program. For another store, message us."]],
    [["¿Qué necesito para el bot de WhatsApp?", "Un número de WhatsApp Business de tu tienda y el adicional del bot en tu licencia. Meta da 1.000 conversaciones gratis al mes y Lima Gestor se detiene antes del límite para que no pagues nada a Meta. Te ayudamos a conectarlo."],
     ["O que preciso para o robô de WhatsApp?", "Um número de WhatsApp Business da sua loja e o adicional do robô na sua licença. A Meta dá 1.000 conversas grátis por mês e o Lima Gestor para antes do limite para você não pagar nada à Meta. Ajudamos a conectar."],
     ["What do I need for the WhatsApp bot?", "A WhatsApp Business number for your store and the bot add-on on your license. Meta gives 1,000 free conversations a month and Lima Gestor stops before the limit so you pay Meta nothing. We help you connect it."]],
  ],

// >>> PRECIOS (generado por LimaGestor/herramientas/sincronizar_precios.py desde licencia.py; no editar a mano)
const PRICES = {

  BR: { cur: "R$ ", m: 99, s: 519, a: 899, x: [39, 199, 349], bot: [149, 779, 1349] },
};
const PRICE_US = { cur: "US$ ", m: 25, s: 129, a: 229 };
// <<< PRECIOS
// Programa de referidos: el enlace que comparte una tienda trae ?ref=ABC-DEF
const REF = (new URLSearchParams(location.search).get("ref") || "").toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 6);
T.ref_box = ["🎁 Te recomendó una tienda que ya usa Lima Gestor. Cuando pagues tu primera licencia, en Configuración → Licencia → «Subir comprobante», escribe su código <b>{c}</b> en «Código de quien te recomendó».", "🎁 Uma loja que já usa o Lima Gestor te indicou. Quando pagar a primeira licença, em Configurações → Licença → «Enviar comprovante», coloque o código <b>{c}</b> em «Código de quem indicou».", "🎁 A store that already uses Lima Gestor referred you. When you pay your first license, in Settings → License → «Send receipt», enter code <b>{c}</b> under «Referral code»."];
const LI = { es: 0, pt: 1, en: 2 };
let L = "es", C = "PE", VER = null, userC = false, PROMO = null, RUB = "tiendas";
const BOT_SALE = false;  // el bot de WhatsApp está en fase de pruebas: sin fecha de salida todavía
const API = "https://lima-api.shamer-licond.workers.dev";
// descuento que Lima Softwares define en LimaAdmin (mismo redondeo que el programa: a la unidad)
const promoFor = (plan) => (PROMO && (PROMO.country || "ALL") !== (C === "PE" ? "BR" : "PE") ? ((PROMO.plans || {})[plan] ?? (PROMO.plans ? 0 : PROMO.pct)) : 0);
const disc = (v, pct) => (pct ? Math.floor((v * 100 * (100 - pct) + 5000) / 10000) : v);
// Curso en orden (00, 01, 02…): pega aquí el ID de la lista «Curso Lima Gestor (español)»
// (lo que va después de "list=" en su enlace). Mientras esté vacío se usan los videos del canal (salen del más nuevo al más antiguo).
const YT_COURSE = "PLBAmHKLbP9FM";
const YT_LIST = YT_COURSE || "UUdNh2Qo5dHc3_5dJ9-C7aVA";
if (YT_COURSE) document.querySelector('[data-t="vd_btn"]').href = "https://www.youtube.com/playlist?list=" + YT_COURSE;
document.getElementById("playbtn").onclick = () => {
  document.getElementById("player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${YT_LIST}&index=0&autoplay=1&rel=0" title="Lima Gestor" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
};
// {pe_m} {br_m} {us_m} = precio mensual de cada país; {x_m} {x_s} {x_a} = computadora adicional del país elegido (salen de PRICES)
const fillPrices = (v) => v.replace(/\{(pe|br|us)_m\}/g, (_, c) => (c === "pe" ? PRICES.PE.m : c === "br" ? PRICES.BR.m : PRICE_US.m))
  .replace("{x_m}", fmt(PRICES[C].x[0])).replace("{x_s}", fmt(PRICES[C].x[1])).replace("{x_a}", fmt(PRICES[C].x[2]));
const tx = (k) => fillPrices((T[k] || [k, k, k])[LI[L]]);
const fmt = (v) => {
  const loc = C === "BR" ? "pt-BR" : "es-PE";
  return PRICES[C].cur + v.toLocaleString(loc, { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
};
function render() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-set]").forEach((b) => b.classList.toggle("on", b.dataset.set === L));
  document.querySelectorAll("[data-t]").forEach((el) => { const v = tx(el.dataset.t); if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v; });
  const rb = document.getElementById("refbox");
  if (rb && REF.length === 6) { rb.hidden = false; rb.innerHTML = tx("ref_box").replace("{c}", REF.slice(0, 3) + "-" + REF.slice(3)); }
  document.querySelectorAll("[data-img]").forEach((im) => { im.src = `img/${L}_${im.dataset.img}.jpg`; });
  document.querySelectorAll("[data-wa]").forEach((a) => { a.href = `https://wa.me/${WA}?text=${encodeURIComponent(tx("wa_msg"))}`; a.target = "_blank"; a.rel = "noopener"; });
  document.getElementById("seg").innerHTML = T.segs[LI[L]].map((s) => `<span>${s}</span>`).join("");

  document.getElementById("rbody").innerHTML = `<span class="st ${ru.st}">${ru.stt}</span><p style="margin:12px 0 0">${ru.lead}</p>
    <h4>${tx("rb_yes")}</h4><ul>${ru.yes.map((i) => `<li>${i}</li>`).join("")}</ul>
    ${ru.no.length ? `<h4>${tx("rb_no")}</h4><ul>${ru.no.map((i) => `<li>${i}</li>`).join("")}</ul>` : ""}
    <h4>${tx("rb_faq")}</h4>${ru.faq.map(([a, b]) => `<details><summary>${a}</summary><p>${b}</p></details>`).join("")}
    ${ru.st === "ok" ? "" : `<a class="btn s sm" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(tx("rb_wa").replace("{r}", ru.name.toLowerCase()))}">${tx("rb_notify")}</a>`}`;
  document.getElementById("faq").innerHTML = T.faq.map((q) => { const [a, b] = q[LI[L]]; return `<details><summary>${fillPrices(a)}</summary><p>${fillPrices(b)}</p></details>`; }).join("");
  document.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", b.dataset.c === C));
  const P = PRICES[C];
  const PP = { p_m: promoFor("monthly"), p_s: promoFor("semiannual"), p_a: promoFor("annual") };  // el descuento es por plan; el bot no lleva
  const pmax = Math.max(PP.p_m, PP.p_s, PP.p_a);
  const pe = document.getElementById("promo");
  pe.hidden = !pmax;
  if (pmax) {
    const [y, mo, d] = PROMO.until.split("-").map(Number);
    pe.textContent = "🏷️ " + tx("promo_t").replace("{l}", PROMO.label || tx("promo_l")).replace("{p}", [PP.p_m, PP.p_s, PP.p_a].every((v) => v === pmax) ? pmax : ({ es: "hasta ", pt: "até ", en: "up to " }[L]) + pmax)
      .replace("{d}", new Date(y, mo - 1, d).toLocaleDateString(L === "en" ? "en" : L === "pt" ? "pt-BR" : "es-PE", { day: "numeric", month: "long" }));
  }
  const plan = (k, months, full, best) => {
    const price = disc(full, PP[k]);
    const save = disc(P.m, PP.p_m) * months - price;
    return `<div class="plan ${best ? "best" : ""}">${best ? `<span class="badge">${tx("p_best")}</span>` : ""}
      <h4>${tx(k)}</h4>${price !== full ? `<span class="was">${fmt(full)}</span>` : ""}<div class="price">${fmt(price)}</div>
      <div class="per">${months === 1 ? tx("p_per_m") : tx("p_eq").replace("{v}", fmt(Math.round(price / months * 100) / 100))}</div>
      <div class="save">${save > 0 ? tx("p_save").replace("{v}", fmt(save)) : ""}</div>
      <p class="note" style="margin-top:10px">${tx("p_inc")}</p>
      <p class="note" style="margin-top:6px">${tx("p_extra")}</p>
      <a class="btn ${best ? "p" : "s"}" style="width:100%;margin-top:14px" href="#descargar">${tx("cta_try")}</a></div>`;
  };
  document.getElementById("plans").innerHTML = plan("p_m", 1, P.m) + plan("p_s", 6, P.s) + plan("p_a", 12, P.a, true);
  // Bot de WhatsApp: en pruebas, aún no se vende. Al salir: BOT_SALE = true y vuelven los precios.
  document.getElementById("botprice").textContent = BOT_SALE ? tx("p_bot_price").replace("{m}", fmt(P.bot[0])).replace("{s}", fmt(P.bot[1])).replace("{a}", fmt(P.bot[2])) : tx("p_bot_soon");
  const btn = document.getElementById("dlbtn"), ver = document.getElementById("ver");
  const sb = document.getElementById("storebtn"), store = VER && VER.store_url;
  // Con la app en Microsoft Store: se instala desde ahí (firmada por Microsoft, sin avisos de Windows)
  const direct = document.getElementById("direct"), dllink = document.getElementById("dllink");
  sb.hidden = !store; btn.hidden = !!store;
  const hasParts = !!(VER && VER.parts && VER.parts.length);
  dllink.hidden = !store || !hasParts;
  direct.hidden = dllink.hidden;
  if (store) {
    sb.href = store;
    // Protocolo ms-windows-store:// abre la app Store; target=_blank solo deja una pestaña vacía
    if (/^ms-windows-store:/i.test(store)) sb.removeAttribute("target");
    else sb.setAttribute("target", "_blank");
  }
  document.getElementById("d1").textContent = tx(store ? "d_1s" : "d_1");
  document.getElementById("d2").textContent = tx(store ? "d_2s" : "d_2");
  if (store) ver.textContent = tx("d_vers").replace("{v}", VER.version);
  else if (VER && VER.parts && VER.parts.length) {
    btn.href = "#descargar"; btn.classList.remove("off"); btn.removeAttribute("aria-disabled");
    ver.textContent = tx("d_ver").replace("{v}", VER.version).replace("{s}", VER.size_mb || "≈30");
  } else {
    btn.removeAttribute("href"); btn.classList.add("off"); btn.setAttribute("aria-disabled", "true");
    ver.textContent = tx("d_soon");
  }
  try { localStorage.setItem("lang", L); if (userC) localStorage.setItem("ctry", C); } catch (e) {}
}
document.querySelectorAll("[data-set]").forEach((b) => b.onclick = () => { L = b.dataset.set; if (!userC) C = L === "pt" ? "BR" : "PE"; render(); });
document.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { C = b.dataset.c; userC = true; render(); });
document.getElementById("rtabs").onclick = (e) => { const b = e.target.closest("[data-r]"); if (b) { RUB = b.dataset.r; render(); } };
document.getElementById("burger").onclick = () => document.getElementById("nav").classList.toggle("open");
document.querySelectorAll("#nav a").forEach((a) => a.onclick = () => document.getElementById("nav").classList.remove("open"));
try {
  const s = localStorage.getItem("lang"); const n = (navigator.language || "es").slice(0, 2);
  L = s in LI ? s : (n in LI ? n : "es");

} catch (e) {}
document.getElementById("y").textContent = new Date().getFullYear();
render();
// Descarga: el instalador está en pedazos de 20 MB (límite de Cloudflare Pages); aquí se juntan en un solo .exe
let busy = false;
const directDl = async (e) => {
  e.preventDefault();
  if (busy || !VER || !VER.parts || !VER.parts.length) return;
  busy = true;
  const ver = document.getElementById("ver"), total = VER.bytes || 1, chunks = [];
  let got = 0;
  try {
    for (const p of VER.parts) {
      const r = await fetch(p + "?v=" + VER.version);
      if (!r.ok) throw new Error(r.status);
      const rd = r.body.getReader();
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        chunks.push(value); got += value.length;
        ver.textContent = tx("d_prog").replace("{p}", Math.min(100, Math.round(got * 100 / total)));
      }
    }
    const blob = new Blob(chunks, { type: "application/octet-stream" });
    if (VER.sha256 && crypto.subtle) {  // comprueba que el archivo llegó completo y sin cambios
      const h = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
      if (h !== VER.sha256) throw new Error("hash");
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = VER.file || "LimaGestor_Instalador.exe";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    ver.textContent = tx("d_ok");
  } catch (err) {
    ver.textContent = tx("d_err");
  }
  busy = false;
};
document.getElementById("dlbtn").addEventListener("click", directDl);
document.getElementById("dllink").addEventListener("click", directDl);
// versión publicada: la escribe construir_instalador.bat en version.json
fetch(API + "/v1/promo").then((r) => (r.ok ? r.json() : null)).then((d) => { if (d && d.promo && d.promo.pct) { PROMO = d.promo; render(); } }).catch(() => {});
fetch("version.json?" + Date.now()).then((r) => (r.ok ? r.json() : null)).then((v) => { if (v) { VER = v; render(); } }).catch(() => {});
</script>
