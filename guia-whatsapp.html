  document.getElementById("soon").hidden = !!GUIA_YT[L] || document.querySelector("#player iframe") !== null;
  const chs = G[L];
  document.getElementById("toc").innerHTML = chs.map((c) => `<a href="#c${c.n}"><b>${c.n >= 1 && c.n <= 7 ? c.n : c.n === 0 ? "·" : "✓"}</b><span>${esc(c.t)}</span></a>`).join("");
  document.getElementById("chapters").innerHTML = chs.map((c) => {
    const num = c.n >= 1 && c.n <= 7;
    const list = c.s.map((s) => `<li>${fmt(s)}</li>`).join("");
    return `<section class="ch" id="c${c.n}"><h2>${num ? `<b>${c.n}</b>` : ""}${esc(c.t)}</h2>${num ? `<ol>${list}</ol>` : `<ul>${list}</ul>`}</section>`;
  }).join("");
  spy();
}
document.querySelectorAll(".lang button").forEach((b) => b.onclick = () => {
  L = b.dataset.l; try { localStorage.setItem("lg_lang", L); } catch (e) {}
  history.replaceState(null, "", "?l=" + L + location.hash); render();
});
document.getElementById("play").onclick = () => {
  const id = GUIA_YT[L];
  if (!id) { document.getElementById("soon").hidden = false; return; }
  document.getElementById("player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(T.title[LI[L]])}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
};
let io;
function spy() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) document.querySelectorAll(".toc a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll(".ch").forEach((s) => io.observe(s));
}
render();
</script>
</body>
</html>
