<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F4D35">
<title>Conectar · Lima Gestor</title>
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<style>
  :root { --green:#1F4D35; --ink:#18291F; --muted:#66766C; --line:#DAE2D7; --bg:#EEF2EC; --red:#B23A2A; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:16px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; max-width:420px; width:100%; text-align:center; display:grid; gap:12px; }
  h1 { margin:0; font-size:20px; } p { margin:0; color:var(--muted); line-height:1.5; }
  input { width:100%; padding:13px; border:1px solid var(--line); border-radius:12px; font:700 20px ui-monospace,Consolas,monospace; text-align:center; letter-spacing:.1em; text-transform:uppercase; }
  .btn { display:block; width:100%; padding:13px; border:0; border-radius:12px; background:var(--green); color:#fff; font-weight:700; font-size:16px; cursor:pointer; font-family:inherit; }
  .btn.alt { background:#fff; color:var(--green); border:2px solid var(--green); }
  .link { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:13px; cursor:pointer; }
  .err { color:var(--red); min-height:18px; font-size:14px; }
  .small { font-size:13px; }
</style>
</head>
<body>
<div class="box">
  <img src="icono.png" alt="" width="56" height="56" style="margin:0 auto">
  <h1 id="t"></h1>
  <p id="p"></p>
  <form id="f" hidden><input id="c" maxlength="9" placeholder="ABCD-EFGH" autocomplete="off"><div class="err" id="e"></div><button class="btn" id="go"></button></form>
  <button class="btn" id="b" hidden></button>
  <button class="btn alt" id="w" hidden></button>
  <button class="link" id="x" hidden></button>
  <p class="small" id="s"></p>
</div>
<script>
// Celular o tablet como CAJA desde otra red: esta página (dirección fija) guarda el código de la tienda y una llave
// propia del celular, y abre la computadora principal aunque su dirección de internet cambie al reiniciarse.
const API = "https://lima-api.shamer-licond.workers.dev";
const L = (navigator.language || "es").slice(0, 2);
const T = {
  t: ["Conectar este equipo a la tienda", "Conectar este aparelho à loja", "Connect this device to the store"],
  p: ["Escribe el código de la tienda. Está en la computadora principal: Configuración → Computadoras.", "Digite o código da loja. Fica no computador principal: Configurações → Computadores.", "Enter the store code. It's on the main computer: Settings → Computers."],
  go: ["Conectar", "Conectar", "Connect"], bad: ["El código tiene 8 letras/números, ej. ABCD-EFGH.", "O código tem 8 letras/números, ex.: ABCD-EFGH.", "The code has 8 letters/numbers, e.g. ABCD-EFGH."],
  unknown: ["No encontramos la tienda con ese código. Revisa el código y que la computadora principal esté prendida, con Lima Gestor abierto y con internet.", "Não encontramos a loja com esse código. Confira o código e se o computador principal está ligado, com o Lima Gestor aberto e com internet.", "We couldn't find a store with that code. Check the code, and that the main computer is on, with Lima Gestor open and online."],
  wifi: ["Estoy en el WiFi de la tienda: entrar directo", "Estou no WiFi da loja: entrar direto", "I'm on the store's WiFi: go straight in"],
  wifit: ["Si estás conectado al WiFi de la tienda, entra directo (no necesita internet):", "Se você está no WiFi da loja, entre direto (não precisa de internet):", "If you're on the store's WiFi, go straight in (no internet needed):"],
  open: ["Abriendo la caja…", "Abrindo o caixa…", "Opening the register…"], wait: ["Conectando con la computadora de la tienda.", "Conectando ao computador da loja.", "Connecting to the store's computer."],
  slow: ["Buscando la tienda… La primera vez (o si la computadora recién se prendió) puede tardar 1 a 2 minutos. No cierres esta página. ({s} s)", "Procurando a loja… Na primeira vez (ou se o computador acabou de ligar) pode levar de 1 a 2 minutos. Não feche esta página. ({s} s)", "Looking for the store… The first time (or right after the computer starts) it can take 1–2 minutes. Keep this page open. ({s} s)"],
  off: ["La computadora de la tienda no está conectada", "O computador da loja não está conectado", "The store's computer isn't online"],
  offp: ["Debe estar prendida, con Lima Gestor abierto y con internet.", "Ele precisa estar ligado, com o Lima Gestor aberto e com internet.", "It must be on, with Lima Gestor open and online."],
  retry: ["Reintentar", "Tentar de novo", "Try again"], other: ["Usar otro código", "Usar outro código", "Use another code"],
  tip: ["Sirve en celular, tablet o computadora, en el mismo WiFi o en otro internet. La primera vez el dueño aprueba este equipo en la computadora principal. Luego guarda esta página (en el celular: Agregar a la pantalla de inicio).", "Serve em celular, tablet ou computador, no mesmo WiFi ou em outra internet. Na primeira vez o dono aprova este aparelho no computador principal. Depois salve esta página (no celular: Adicionar à tela inicial).", "Works on phone, tablet or computer, same WiFi or another network. The first time, the owner approves this device on the main computer. Then save this page (on a phone: Add to home screen)."],
};
const tx = (k) => T[k][L === "pt" ? 1 : L === "en" ? 2 : 0];
const $ = (id) => document.getElementById(id);
const ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const norm = (v) => { const r = String(v || "").toUpperCase().split("").filter((ch) => ABC.includes(ch)).join(""); return r.length === 8 ? r.slice(0, 4) + "-" + r.slice(4) : ""; };
const newKey = () => { const b = new Uint8Array(32); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
let acc = null;
try { acc = JSON.parse(localStorage.getItem("lg_caja") || "null"); } catch { acc = null; }
// el QR trae el código y, si hay, la dirección del WiFi de la tienda: #ABCD-EFGH~192.168.1.20:5180
const [hCode, hLan] = location.hash.slice(1).split("~");
const fromHash = norm(hCode);
const lanHint = /^(\d{1,3}\.){3}\d{1,3}:\d{2,5}$/.test(hLan || "") ? hLan : "";
if (fromHash && (!acc || acc.c !== fromHash)) acc = { c: fromHash, k: (acc && acc.k) || newKey() };
if (acc && lanHint && acc.c === fromHash) acc.l = lanHint;
const save = () => { try { localStorage.setItem("lg_caja", JSON.stringify(acc)); } catch { /* sin almacenamiento */ } };
$("s").textContent = tx("tip"); $("go").textContent = tx("go"); $("x").textContent = tx("other"); $("w").textContent = tx("wifi");
// mismo WiFi: se abre la principal directo por la red de la tienda (no depende de internet ni del servidor)
$("w").onclick = () => { if (!acc || !acc.l) return; save(); location.href = `http://${acc.l}/?dev=${encodeURIComponent(acc.k)}`; };
const showWifi = (strong) => { $("w").hidden = !(acc && acc.l); $("w").className = strong ? "btn" : "btn alt"; };

function ask(err) {
  $("t").textContent = tx("t"); $("p").textContent = tx("p");
  $("f").hidden = false; $("b").hidden = true; $("x").hidden = true; $("e").textContent = err ? tx(err) : "";
  showWifi(!!err);
  if (acc) $("c").value = acc.c;
}
// La dirección nueva de la principal tarda en llegar a todos los servidores de internet (hasta ~2 min):
// se reintenta solo antes de decir que el código no existe o que la computadora está apagada.
const WAIT_MS = 150000;
async function reachable(u) {
  try { await fetch(`${u}/static/favicon.svg?t=${Date.now()}`, { mode: "no-cors", cache: "no-store" }); return true; } catch { return false; }
}
let busyGo = false;
async function go() {
  if (!acc) return ask();
  if (busyGo) return;
  busyGo = true;
  $("f").hidden = true; $("x").hidden = false; $("b").hidden = true;
  $("t").textContent = tx("open"); $("p").textContent = tx("wait");
  showWifi(false);
  const t0 = Date.now();
  let last = "off";
  while (Date.now() - t0 < WAIT_MS) {
    if (!$("f").hidden) { busyGo = false; return; }  // tocó "Usar otro código"
    try {
      const r = await fetch(`${API}/v1/rt/${acc.c}?t=${Date.now()}`, { cache: "no-store" });
      const d = await r.json();
      if (d.url) {
        last = "off";
        if (await reachable(d.url)) { save(); location.replace(`${d.url}/?dev=${encodeURIComponent(acc.k)}`); return; }
      } else if (r.status === 404) last = "unknown";
    } catch { last = "off"; }
    if (Date.now() - t0 > 6000) $("p").textContent = tx("slow").replace("{s}", Math.round((Date.now() - t0) / 1000));
    await new Promise((ok) => setTimeout(ok, 5000));
  }
  busyGo = false;
  if (last === "unknown") return ask("unknown");
  $("t").textContent = tx("off"); $("p").textContent = tx("offp") + (acc && acc.l ? " " + tx("wifit") : ""); $("b").textContent = tx("retry"); $("b").hidden = false;
  showWifi(true);
}
$("f").onsubmit = (e) => { e.preventDefault(); const c = norm($("c").value); if (!c) return ask("bad"); acc = { c, k: (acc && acc.k) || newKey() }; save(); go(); };
$("b").onclick = go;
$("x").onclick = () => ask();
go();
</script>
</body>
</html>
